# SonarQube Cloud project configuration. Free for public repositories.
#
# The key and organisation follow SonarCloud's own convention for a GitHub import
# (<org>_<repo> and the lower-cased org), so importing this repository through the UI produces
# exactly these values and nothing here has to be edited afterwards.
sonar.projectKey=Check-It-Out-Dev_checkitout-frontend
sonar.organization=check-it-out-dev
sonar.projectName=checkItOut frontend

sonar.sources=src,tools
sonar.tests=e2e-tests
sonar.sourceEncoding=UTF-8

# Written by `npm test -- --coverage`; jest.config already emits lcov.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Generated, built, or vendored — in that order.
#
# src/app/api is the OpenAPI client: it is regenerated from the backend's contract on every change,
# and no one edits it, so its duplication and complexity scores would measure openapi-generator
# rather than this codebase. The same reasoning covers the mock service worker and the built output.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.angular/**,\
  src/app/api/**,\
  src/app/core/api-frozen/**,\
  src/mockServiceWorker.js,\
  e2e-tests/**/*-snapshots/**

# Specs are analysed, but a fixture's hard-coded string is the point of the fixture.
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.config.ts,\
  src/main.ts,\
  src/main.server.ts,\
  src/app/api/**,\
  e2e-tests/**

# One rule, turned off in one place, with the reasoning in docs/ci/ADR-input-labels.md.
#
# Web:InputWithoutLabelCheck reports 67 unlabelled inputs in these templates. 66 of them sit inside
# an Angular Material <mat-form-field> with a <mat-label>, which Material associates through
# aria-labelledby when the component initialises. The association is real and is what a screen reader
# uses; it just does not exist until runtime, and a static HTML checker reads the template as a file.
#
# Quieting it by adding aria-label to all 67 would leave each control carrying both an aria-label and
# an aria-labelledby, with aria-label winning -- the announced name would come from an attribute that
# no longer has to agree with the visible text. Two sources of truth for one label, kept in step by
# nobody. So the rule is excluded here and replaced by check:input-labels, which enforces the rule
# this code actually follows across every template on every commit, and fails on an input that really
# has no accessible name. The one finding that was real is fixed.
#
# Scoped deliberately: this rule, these files. Nothing else is suppressed.
sonar.issue.ignore.multicriteria=inputLabels
sonar.issue.ignore.multicriteria.inputLabels.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.inputLabels.resourceKey=src/app/**/*.html

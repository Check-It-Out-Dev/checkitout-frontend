# The browser tiers that need no backend, on every pull request and push: sandbox and MSW across four
# runners against the dev server the Playwright config boots, the smoothness tier against a served demo
# build, and the visual tier inside the pinned Playwright container once the Linux baseline set exists
# (docs/ci/ADR-visual-baselines.md). Every job writes a blob report; the merge job makes one report and one
# verdict with tools/ci/k8s-summary.mjs. The gate wall (static checks, typecheck, Jest) stays in ci-tests.yml.
name: browser-tiers

on:
  workflow_call:
    inputs:
      tiers:
        description: fast (sandbox and MSW only) or full (adds smoothness and visual)
        type: string
        default: full
  workflow_dispatch:
    inputs:
      tiers:
        description: fast or full
        type: choice
        options: [full, fast]
        default: full


# The group is keyed by the CALLING pipeline as well as the ref. Without `github.workflow` --
# which under workflow_call is the caller's name -- a push to main starts `pr`, `pr` calls this
# tier, and it cancels the copy the night is already running. That happened on the first night:
# three shards cancelled mid-run and the verdict correctly called the night incomplete.
concurrency:
  group: browser-tiers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NG_CLI_ANALYTICS: "false"
  NODE_OPTIONS: "--max-old-space-size=4096"
  CI: "1"

jobs:
  sandbox-msw:
    name: sandbox + msw, shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error
      - run: npx playwright install --with-deps chromium
      # The config's webServer boots `npm run start -- --port=4201` (prestart mints the dev certificate).
      - run: npx playwright test e2e-tests/sandbox e2e-tests/msw --project=chromium-desktop --project=mobile-chrome --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-blob-sandbox-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  perf:
    # One worker per runner (two workers on one machine drop frames in each other's measurements), so the
    # tier is spread over three runners instead: the film spec alone records fourteen tours at 27 to 120 s
    # each, and the whole tier ran past 30 minutes on a single ubuntu-latest runner.
    name: smoothness, shard ${{ matrix.shard }}/3
    # The smoothness tier is three shards of 9-19 minutes; the pull-request pipeline skips it and the nightly runs it.
    if: ${{ inputs.tiers != 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error
      - run: npx playwright install --with-deps chromium
      # tools/run-perf.mjs builds the demo, serves it on 4300 and runs the perf project against it.
      - run: npm run test:perf -- --reporter=blob --shard=${{ matrix.shard }}/3
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          # Absolute frame-timing budgets are measured and reported here, never asserted: a shared
          # runner's 67 ms frame is the runner's (ARCHITECTURE.md §4). Structural budgets stay hard.
          PERF_TIMING: report
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-blob-perf-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  visual:
    name: visual (pinned rasteriser)
    # Rasterising in the pinned container is minutes of pull, for a tier that only moves when a baseline does.
    if: ${{ inputs.tiers != 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The baselines are this image's own output (docs/ci/ADR-visual-baselines.md): captured by
      # tools/visual-docker.mjs on the dev box, compared here, one rasteriser for both.
      #
      # `docker run` rather than a `container:` job, and mounted at the workspace's own path. A container
      # job puts the workspace at /__w/<repo>/<repo> while the shards beside it see
      # /home/runner/work/<repo>/<repo>; Playwright records the absolute test directory in every blob, and
      # merge-reports refuses a set that disagrees: "Blob reports being merged were recorded with
      # different test directories". Mounting at $GITHUB_WORKSPACE makes every blob in the run agree.
      #
      # The image ships Node 24.14 and Angular 22's CLI refuses anything below 24.15 - it exits 3 before
      # serving and Playwright reports only that the webServer would not start - so the version in .nvmrc
      # is installed first. gzip is present in the image, xz is not.
      - name: Visual tier inside the pinned Playwright image
        continue-on-error: true
        run: |
          docker run --rm --ipc=host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e CI=1 -e HOME=/root -e PLAYWRIGHT_BLOB_OUTPUT_DIR=blob-report \
            mcr.microsoft.com/playwright:v1.59.1-noble bash -lc '
              set -e
              want=$(tr -d "\r\n" < .nvmrc)
              if [ "$(node -p "process.versions.node")" != "$want" ]; then
                curl -fsSL "https://nodejs.org/dist/v$want/node-v$want-linux-x64.tar.gz" \
                  | tar -xz -C /usr/local --strip-components=1
              fi
              npm ci --prefer-offline --no-audit --loglevel=error
              npx playwright test e2e-tests/visual --project=chromium-desktop --project=mobile-chrome --reporter=blob
            '
      # The container writes as root; the upload step and everything after it run as the runner user.
      - name: Hand the report back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" blob-report 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-blob-visual
          path: blob-report
          retention-days: 7

  merge:
    name: One report, one verdict
    needs: [sandbox-msw, perf, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error
      - uses: actions/download-artifact@v7
        with:
          pattern: browser-blob-*
          path: fragments
          merge-multiple: true
      - name: Merge
        run: |
          mkdir -p ci-reports/blobs
          find fragments -name '*.zip' -exec cp {} ci-reports/blobs/ \;
          PLAYWRIGHT_HTML_OUTPUT_DIR=ci-reports/merged PLAYWRIGHT_HTML_REPORT=ci-reports/merged PLAYWRIGHT_JSON_OUTPUT_NAME=ci-reports/merged.json \
            npx playwright merge-reports --reporter html,json ci-reports/blobs
      # The verdict is recorded here but does not stop the job: a red or an incomplete run must still publish
      # its numbers, or the dashboard can only ever show the last green run. The job is failed at the very end.
      - name: Verdict
        id: verdict
        continue-on-error: true
        env:
          # Every job this verdict speaks for: a cancelled shard makes the run incomplete, never green.
          NEEDS: ${{ toJSON(needs) }}
        run: set -o pipefail; node tools/ci/k8s-summary.mjs ci-reports --needs "$NEEDS" --optional perf,visual --json ci-reports/summary.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-report-${{ github.run_number }}
          path: |
            ci-reports
            !ci-reports/blobs
          retention-days: 30
      - name: Pages site (previous state)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      # Allure reads the SAME blobs a second time, through allure-playwright, so the report carries the
      # Playwright steps, attachments and retries rather than a JUnit summary. Allure 3 keeps history in a
      # single history.jsonl named by allurerc.mjs - there is no history/ directory any more - so the file
      # is carried on the Pages site, one per workflow: browser-tiers and k8s run different suites and a
      # shared history would call every test of the other suite "new" on every run.
      - name: Allure 3 (the same blobs, history from the site)
        # The report is a nice-to-have; the verdict below is what decides the job. A failure here
        # must never stop the dashboard and the metrics from being published.
        continue-on-error: true
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          cp "site/allure/history-browser-tiers.jsonl" history.jsonl 2>/dev/null || true
          npx playwright merge-reports --reporter allure-playwright ci-reports/blobs
          npx --yes allure generate --config allurerc.mjs ./allure-results --output allure-report
          mkdir -p site/allure && cp history.jsonl "site/allure/history-browser-tiers.jsonl"
      - name: Quality metrics into the site
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p site && rm -rf site/.git
          STARTED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          DURATION=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
          node tools/ci/quality-metrics.mjs --out site --workflow browser-tiers --started-at "$STARTED_AT" --duration-sec "$DURATION" \
            --playwright ci-reports/merged.json --verdict ci-reports/summary.json --copy playwright=ci-reports/merged \
            --jest site/jest/latest.json --coverage site/coverage/latest.json --lighthouse site/lighthouse/latest.json --copy allure=allure-report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A retrying overlay push rather than the action, because several tiers publish in parallel
        # now and the loser of the race used to drop its whole report. See the script's header.
        run: |
          bash tools/ci/publish-pages.sh site "browser-tiers run ${{ github.run_number }}"
      - name: The verdict decides the job
        if: always() && steps.verdict.outcome == 'failure'
        run: |
          STATUS=$(node -p "try{require('./ci-reports/summary.json').status}catch{'red'}")
          echo "Verdict: $STATUS. The report was published; the job is failed so nothing reads it as green." >&2
          exit 1

# The public sandbox rollout: build the frontend image for the sandbox configuration, deploy it with a
# backend image from ghcr.io to the VPS through a deploy key that can run nothing but rollout.sh, smoke the
# result from the outside, run the k6 sandbox profile against it, and roll back on any failure.
# Design of record: docs/ci/SANDBOX.md. Secrets live in the `sandbox` environment (owner = required reviewer).
name: deploy-sandbox

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: Backend image tag on ghcr.io (main, or a short sha)
        type: string
        default: main
      frontend_tag:
        description: Frontend image tag to deploy; leave empty to build one from this ref
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "angular.json"
      - "package-lock.json"
      - "deploy/sandbox/**"
      - "deploy/k8s/frontend/**"
      - ".github/workflows/deploy-sandbox.yml"

# The concurrency group is on the DEPLOY JOB, not on the workflow, and that is the whole fix for
# a failure that looked like a GitHub fault for two days.
#
# Three consecutive runs sat in `pending` with zero jobs and no log. Nothing appeared to hold the
# group, `?status=queued` was empty and Actions reported operational, so it was written up as
# unexplained and left. It is explained: `?status=WAITING` had two entries. Two runs from the day
# before were parked on the `sandbox` environment's approval gate, which nobody had answered.
# A waiting run holds its concurrency group exactly like a running one, and with
# cancel-in-progress: false every later run queues behind it -- forever, because an approval gate
# has no timeout. GitHub reports that state as `pending` with an empty job list, which is also
# what an invalid workflow file produces, and the two are told apart only by that WAITING query.
#
# With the group on the job, an unanswered gate no longer stops the image from being built, and a
# stale deploy no longer blocks a fresh one from being offered for approval. Rollouts still
# serialise, and one in flight is still never cancelled: a half-finished rollout is worse than a
# queued one.
#
# When a deploy pends with zero jobs, the first thing to look at is:
#   gh api "repos/<owner>/<repo>/actions/runs?status=waiting"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/check-it-out-dev/checkitout-frontend
  # One public address for the demo and the real stack; sandbox.checkitout.app redirects here.
  SANDBOX_URL: https://checkitout.app/sandbox

jobs:
  image:
    name: Frontend image (production,sandbox)
    if: ${{ github.event_name == 'push' || inputs.frontend_tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:sandbox
      - id: meta
        run: echo "tag=sandbox-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: deploy/k8s/frontend/Dockerfile
          # Always re-pull the base. `cache-from: type=gha` will happily reuse a base layer from
          # weeks ago, so `eclipse-temurin:21-jre-alpine` stays whatever digest the tag pointed at
          # when the cache was warmed -- which is why Trivy keeps reporting openssl and libexpat
          # CVEs against an image whose base has since been rebuilt upstream. The application
          # layers still come from the cache; only the FROM is re-resolved.
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:sandbox
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out, smoke, k6
    needs: [image]
    if: ${{ always() && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One rollout at a time on the host, and never cancel one in flight. Scoped to this job so an
    # unanswered approval gate cannot hold the whole workflow -- see the note at the top.
    concurrency:
      group: sandbox-rollout
      cancel-in-progress: false
    environment:
      name: sandbox
      # Literal, not ${{ env.SANDBOX_URL }}. The `env` context is documented for most job keys and
      # is evaluated for `environment` before the job's own env exists; with the expression here the
      # job sat `pending` with no deployment ever registered for review -- the approval could not be
      # given because it was never asked for. The value is the same string the workflow-level env
      # holds, and the steps below still read $SANDBOX_URL from there.
      url: https://checkitout.app/sandbox
    env:
      FE_TAG: ${{ inputs.frontend_tag || needs.image.outputs.tag }}
      BE_TAG: ${{ inputs.backend_tag || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Deploy key (forced command on the host, see deploy/sandbox/rollout.sh)
        # Through env rather than interpolated into the script. A secret pasted into a run
        # body is one `set -x` away from the log and one awkward character away from being a
        # syntax error in the middle of a deploy; as a variable it is a value, not source.
        env:
          SSH_KEY: ${{ secrets.SANDBOX_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SANDBOX_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/sandbox
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/sandbox ~/.ssh/known_hosts

      - name: Roll out on the host
        env:
          HOST: ${{ secrets.SANDBOX_HOST }}
        run: |
          ssh -i ~/.ssh/sandbox -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "deploy@$HOST" "deploy $FE_TAG $BE_TAG $GITHUB_SHA"

      # From the outside, but not through Cloudflare: the zone runs Bot Fight Mode, which answers a
      # datacentre curl with 403 whatever the sandbox is doing. Run 34382570406 rolled a healthy release
      # back on that 403. Pinning the hostname to the origin keeps the public name, the public certificate,
      # the host nginx and the whole application under test, and drops only the edge.
      - name: Smoke from the outside
        env:
          SMOKE_RESOLVE: checkitout.app:443:${{ secrets.SANDBOX_ORIGIN_IP }}
        run: bash deploy/sandbox/smoke.sh "$SANDBOX_URL"

      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065  # v1
      - name: k6, sandbox profile (the persona only, one virtual user, low rate)
        env:
          BASE_URL: ${{ env.SANDBOX_URL }}
          K6_ORIGIN_IP: ${{ secrets.SANDBOX_ORIGIN_IP }}
          K6_PROFILE: sandbox
          K6_PERSONA_ONLY: "1"
          K6_P95_BROWSE: "1500"
          K6_P95_APPLY: "2500"
          K6_OUT_DIR: k6-out
          K6_RUN_ID: ${{ github.run_number }}
        run: |
          mkdir -p k6-out
          k6 run e2e-tests/perf/k6/api-journeys.js

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: sandbox-k6-${{ github.run_number }}
          path: k6-out
          retention-days: 30

      - name: Roll back
        if: failure()
        env:
          HOST: ${{ secrets.SANDBOX_HOST }}
        run: |
          ssh -i ~/.ssh/sandbox -o BatchMode=yes -o IdentitiesOnly=yes "deploy@$HOST" rollback

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Sandbox rollout"
            echo
            echo "| frontend | backend | bundle | result |"
            echo "| --- | --- | --- | --- |"
            echo "| \`$FE_TAG\` | \`$BE_TAG\` | \`${GITHUB_SHA::7}\` | $JOB_STATUS |"
            echo
            echo "Live: $SANDBOX_URL · OpenAPI: $SANDBOX_URL/api/v3/api-docs · Swagger UI: $SANDBOX_URL/api/swagger-ui/index.html"
          } >> "$GITHUB_STEP_SUMMARY"

# Test execution on Kubernetes, inside one GitHub-hosted runner: a kind cluster is created in the job,
# the application stack (backend on dev-lite from ghcr.io, Postgres, Redis, the frontend behind nginx) is
# applied from deploy/k8s/base, the browser tiers run as an Indexed Job of four Playwright shards, and k6
# generates load from inside the cluster through the k6-operator. Reports land on the runner as plain
# files through a kind extraMount; the cluster dies with the runner. The design and the local rehearsal
# are in docs/ci/ARCHITECTURE.md §2–§4; the verdict comes from tools/ci/k8s-summary.mjs.
name: k8s-test-execution

on:
  workflow_call:
  workflow_dispatch:


# The group is keyed by the CALLING pipeline as well as the ref. Without `github.workflow` --
# which under workflow_call is the caller's name -- a push to main starts `pr`, `pr` calls this
# tier, and it cancels the copy the night is already running. That happened on the first night:
# three shards cancelled mid-run and the verdict correctly called the night incomplete.
concurrency:
  group: k8s-test-execution-${{ github.workflow }}-${{ github.ref }}
  # The caller's event, because under workflow_call that is whose event it is: a superseded
  # pull-request run is waste, but a superseded push to main loses the record of what main
  # did, and a night is never worth cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  NG_CLI_ANALYTICS: "false"
  NODE_OPTIONS: "--max-old-space-size=4096"
  KIND_CLUSTER: checkitout-ci
  BACKEND_TAG: ${{ inputs.backend_tag || 'main' }}
  SHARDS: ${{ inputs.shards || 4 }}

jobs:
  cluster:
    name: kind cluster, 4 shards, 2 k6 runners
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds the K6_PROMETHEUS_RW_* secrets (no reviewer): with them the k6 runners also remote-write to the
    # public Grafana Cloud dashboard; without them the run is summaries-only and says so.
    environment: grafana-cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error

      # ---- images: the frontend from the production build, the test image from the pinned Playwright base ----
      - run: npm run build
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      - name: Frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: deploy/k8s/frontend/Dockerfile
          load: true
          tags: checkitout-frontend:ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Test image (layers cached between runs)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: deploy/k8s/tests/Dockerfile.playwright
          build-args: PW_VERSION=${{ steps.pw.outputs.version }}
          load: true
          tags: checkitout-tests:ci
          cache-from: type=gha,scope=tests-image
          cache-to: type=gha,scope=tests-image,mode=max

      # ---- the cluster ----
      - name: Render the kind config (reports mount)
        run: |
          mkdir -p ci-reports
          # The node mounts this directory and pods write their reports into it. The Playwright image runs
          # as root, but the k6 runner does not, and on a runner this directory belongs to uid 1001: every
          # k6 summary was lost to "permission denied" until this chmod (run 34380876130). The runner is
          # ephemeral and holds nothing but the checkout.
          chmod 0777 ci-reports
          CI_REPORTS_DIR="$GITHUB_WORKSPACE/ci-reports" envsubst < deploy/k8s/kind-config.yaml > kind-config.rendered.yaml
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2  # v1.15.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          config: kind-config.rendered.yaml
      - name: k6-operator
        run: |
          kubectl apply -f https://raw.githubusercontent.com/grafana/k6-operator/main/bundle.yaml
          kubectl -n k6-operator-system rollout status deploy/k6-operator-controller-manager --timeout=180s
      - name: Load the local images into the node
        run: kind load docker-image checkitout-frontend:ci checkitout-tests:ci --name "$KIND_CLUSTER"

      # ---- the stack ----
      - name: Apply the stack (backend ${{ env.BACKEND_TAG }})
        run: |
          sed -i "s|newTag: main|newTag: $BACKEND_TAG|" deploy/k8s/base/kustomization.yaml
          kubectl apply -k deploy/k8s/base
          kubectl -n checkitout rollout status deploy/postgres --timeout=180s
          kubectl -n checkitout rollout status deploy/backend --timeout=600s
          kubectl -n checkitout rollout status deploy/frontend --timeout=180s
      - name: Smoke the origin the shards will use (cookies without Secure over plain http)
        run: |
          kubectl -n checkitout run smoke --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- sh -c '
            set -e
            FE=http://frontend.checkitout.svc
            curl -fsS -o /dev/null $FE/healthz && echo "healthz ok"
            curl -fsS $FE/api/actuator/health | grep -q "\"UP\"" && echo "backend UP"
            curl -sS -D /tmp/h -o /dev/null -X POST $FE/api/test/auth/mock-session -H "Content-Type: application/json" -d "{\"email\":\"smoke@checkitout.app\",\"role\":\"COMPANY\"}"
            grep -i "^set-cookie: session=" /tmp/h | grep -qiv "secure" && echo "session cookie without Secure: sign-in will work in the shards"
            C=$(grep -i "^set-cookie" /tmp/h | sed "s/^[Ss]et-[Cc]ookie: //" | cut -d";" -f1 | tr "\r\n" ";")
            curl -fsS -o /dev/null -H "Cookie: $C" $FE/api/users/me && echo "/users/me ok"
          '

      # ---- browser tiers as an Indexed Job ----
      - name: Playwright shards
        run: |
          sed -i -e "s/completions: 4/completions: $SHARDS/" -e "s/parallelism: 4/parallelism: $SHARDS/" -e "s#--shard=\${SHARD}/4#--shard=\${SHARD}/$SHARDS#" deploy/k8s/tests/playwright-indexed-job.yaml
          kubectl apply -f deploy/k8s/tests/playwright-indexed-job.yaml
          kubectl -n checkitout wait --for=condition=complete job/playwright-shards --timeout=40m
          ls -la ci-reports

      # ---- k6 from inside the cluster ----
      - name: k6 remote write to Grafana Cloud (when the environment has the secrets)
        env:
          RW_URL: ${{ secrets.K6_PROMETHEUS_RW_SERVER_URL }}
          RW_USER: ${{ secrets.K6_PROMETHEUS_RW_USERNAME }}
          RW_PASS: ${{ secrets.K6_PROMETHEUS_RW_PASSWORD }}
        run: |
          if [ -z "$RW_PASS" ] || [ -z "$RW_URL" ]; then
            echo "k6: no Grafana Cloud secrets in the grafana-cloud environment; summaries only" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          kubectl -n checkitout create secret generic k6-remote-write             --from-literal=K6_PROMETHEUS_RW_SERVER_URL="$RW_URL"             --from-literal=K6_PROMETHEUS_RW_USERNAME="$RW_USER"             --from-literal=K6_PROMETHEUS_RW_PASSWORD="$RW_PASS"
          echo "K6_REMOTE_WRITE=1" >> "$GITHUB_ENV"
          echo "k6: remote write on, testid=run-$GITHUB_RUN_NUMBER on the public dashboard" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: k6 TestRun (2 runners)
        run: |
          kubectl -n checkitout create configmap k6-scripts --from-file=e2e-tests/perf/k6/
          sed -i "s/testid=local/testid=run-$GITHUB_RUN_NUMBER/; s/value: \"local\"/value: \"$GITHUB_RUN_NUMBER\"/" deploy/k8s/tests/k6-testrun.yaml
          if [ "${K6_REMOTE_WRITE:-0}" = "1" ]; then
            sed -i "s|testid=run-$GITHUB_RUN_NUMBER$|testid=run-$GITHUB_RUN_NUMBER --out experimental-prometheus-rw|" deploy/k8s/tests/k6-testrun.yaml
            awk '{print} /^  runner:$/{print "    envFrom:"; print "      - secretRef: { name: k6-remote-write }"}' deploy/k8s/tests/k6-testrun.yaml > /tmp/k6-testrun.yaml && mv /tmp/k6-testrun.yaml deploy/k8s/tests/k6-testrun.yaml
          fi
          grep -n "arguments:\|envFrom\|secretRef\|K6_RUN_ID" -A0 deploy/k8s/tests/k6-testrun.yaml
          kubectl apply -f deploy/k8s/tests/k6-testrun.yaml
          for i in $(seq 1 120); do
            st=$(kubectl -n checkitout get testrun k6-api-journeys -o jsonpath='{.status.stage}' 2>/dev/null || true)
            [ "$st" = "finished" ] && break
            [ "$st" = "error" ] && { echo "k6-operator reported error"; break; }
            sleep 5
          done
          echo "TestRun stage: $st"
          mkdir -p ci-reports/k6-logs
          for p in $(kubectl -n checkitout get pods -o name | grep 'k6-api-journeys-[0-9]-'); do
            kubectl -n checkitout logs "$p" > "ci-reports/k6-logs/$(basename "$p").log" 2>&1 || true
          done

      # ---- merge, verdict, artifacts ----
      - name: Merge the shard reports
        run: |
          mkdir -p ci-reports/blobs
          cp ci-reports/blob-*/*.zip ci-reports/blobs/
          PLAYWRIGHT_HTML_OUTPUT_DIR=ci-reports/merged PLAYWRIGHT_HTML_REPORT=ci-reports/merged PLAYWRIGHT_JSON_OUTPUT_NAME=ci-reports/merged.json \
            npx playwright merge-reports --reporter html,json ci-reports/blobs
      # The verdict is recorded here but does not stop the job: a red or an incomplete run must still publish
      # its numbers, or the dashboard can only ever show the last green run. The job is failed at the very end.
      - name: Verdict
        id: verdict
        continue-on-error: true
        # There is one job here, so the shard count is the completeness signal: fewer exit files than pods
        # means the report covers less than the run claimed to run.
        run: set -o pipefail; node tools/ci/k8s-summary.mjs ci-reports --expect-shards "$SHARDS" --json ci-reports/k8s-summary.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cluster state on failure
        if: failure()
        run: |
          mkdir -p ci-reports/cluster
          kubectl get events -A --sort-by=.lastTimestamp > ci-reports/cluster/events.txt || true
          kubectl -n checkitout get pods -o wide > ci-reports/cluster/pods.txt || true
          kubectl -n checkitout describe pods > ci-reports/cluster/describe.txt || true
          for p in $(kubectl -n checkitout get pods -o name); do kubectl -n checkitout logs "$p" --all-containers > "ci-reports/cluster/$(basename "$p").log" 2>&1 || true; done
          kubectl describe nodes > ci-reports/cluster/nodes.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: k8s-reports-${{ github.run_number }}
          path: |
            ci-reports
            !ci-reports/blobs
          retention-days: 30
      - name: Pages site (previous state)
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      # Allure reads the SAME blobs a second time, through allure-playwright, so the report carries the
      # Playwright steps, attachments and retries rather than a JUnit summary. Allure 3 keeps history in a
      # single history.jsonl named by allurerc.mjs - there is no history/ directory any more - so the file
      # is carried on the Pages site, one per workflow: browser-tiers and k8s run different suites and a
      # shared history would call every test of the other suite "new" on every run.
      - name: Allure 3 (the same blobs, history from the site)
        # The report is a nice-to-have; the verdict below is what decides the job. A failure here
        # must never stop the dashboard and the metrics from being published.
        continue-on-error: true
        if: always()
        run: |
          set -o pipefail
          cp "site/allure/history-k8s-test-execution.jsonl" history.jsonl 2>/dev/null || true
          npx playwright merge-reports --reporter allure-playwright ci-reports/blobs
          npx --yes allure generate --config allurerc.mjs ./allure-results --output allure-report
          mkdir -p site/allure && cp history.jsonl "site/allure/history-k8s-test-execution.jsonl"
      - name: Quality metrics into the site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p site && rm -rf site/.git
          mkdir -p ci-reports/k6 && cp ci-reports/api-*.json ci-reports/api-*.html ci-reports/k6/ 2>/dev/null || true
          WALL=$(node -p "try{require('./ci-reports/k8s-summary.json').tests.durationSec}catch{0}")
          STARTED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          DURATION=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
          node tools/ci/quality-metrics.mjs --out site --workflow k8s-test-execution --started-at "$STARTED_AT" --duration-sec "$DURATION" \
            --playwright ci-reports/merged.json --verdict ci-reports/k8s-summary.json --k6 'ci-reports/api-*.json' --kubernetes "{\"shards\":$SHARDS,\"wallSec\":$WALL,\"k6Runners\":2}" --copy playwright=ci-reports/merged --copy k6=ci-reports/k6 \
            --jest site/jest/latest.json --coverage site/coverage/latest.json --lighthouse site/lighthouse/latest.json --mutation site/mutation/latest.json --security site/security/latest.json --copy allure=allure-report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A retrying overlay push rather than the action, because several tiers publish in parallel
        # now and the loser of the race used to drop its whole report. See the script's header.
        run: |
          bash tools/ci/publish-pages.sh site "k8s-test-execution run ${{ github.run_number }}"
      - name: Delete the cluster (the runner is ephemeral; deleting keeps the logs honest)
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER" || true
      - name: The verdict decides the job
        if: always() && steps.verdict.outcome == 'failure'
        run: |
          STATUS=$(node -p "try{require('./ci-reports/k8s-summary.json').status}catch{'red'}")
          echo "Verdict: $STATUS. The report was published; the job is failed so nothing reads it as green." >&2
          exit 1

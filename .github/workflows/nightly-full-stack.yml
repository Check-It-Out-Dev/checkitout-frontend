# The full stack every night, without a cluster: the backend image from ghcr.io on the dev-lite profile as
# a service container next to Postgres and Redis, the production frontend build behind the same nginx image
# the kind cluster uses (cookies re-flagged for plain http), and the browser tiers that need a live backend
# split across four runners: the Cucumber-oracle tier, the integration tier in two halves, and the
# scenarios with the sandbox tier. Every shard writes a blob report; the merge job makes one report and one
# verdict (tools/ci/k8s-summary.mjs). GreenMail is in-JVM on dev-lite, so no mailbox container is needed.
# The same tiers run on Kubernetes weekly (k8s-test-execution.yml); this is the fifteen-minute daily version.
name: Frontend CI - Nightly Full Stack (sharded)

on:
  workflow_call:
  workflow_dispatch:


# The group is keyed by the CALLING pipeline as well as the ref. Without `github.workflow` --
# which under workflow_call is the caller's name -- a push to main starts `pr`, `pr` calls this
# tier, and it cancels the copy the night is already running. That happened on the first night:
# three shards cancelled mid-run and the verdict correctly called the night incomplete.
concurrency:
  group: nightly-full-stack-${{ github.workflow }}-${{ github.ref }}
  # The caller's event, because under workflow_call that is whose event it is: a superseded
  # pull-request run is waste, but a superseded push to main loses the record of what main
  # did, and a night is never worth cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NG_CLI_ANALYTICS: "false"
  NODE_OPTIONS: "--max-old-space-size=4096"
  # The suite mints its own ID token by calling Identity Toolkit directly, so it needs the same
  # redirect the backend has. The accounts and their passwords are the seeder's, and the secret is
  # the one provisioned above -- so the 2FA scenarios run for real with no Google project in reach.
  FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
  FIREBASE_TEST_ADMIN_EMAIL: e2e.admin@test.com
  FIREBASE_TEST_ADMIN_PASSWORD: e2e-emulator-password
  FIREBASE_TEST_COMPANY_EMAIL: e2e.company@test.com
  FIREBASE_TEST_COMPANY_PASSWORD: e2e-emulator-password
  FIREBASE_TEST_INFLUENCER_EMAIL: e2e.influencer@test.com
  FIREBASE_TEST_INFLUENCER_PASSWORD: e2e-emulator-password
  ADMIN_FIREBASE_UID: E2E_ADMIN_001
  E2E_TOTP_SECRET: JBSWY3DPEHPK3PXP
  BACKEND_TAG: ${{ inputs.backend_tag || 'main' }}

jobs:
  build:
    name: Production build (once, shared by the shards)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: browser-dist
          path: dist/check-it-out-fe-greenfield/browser
          retention-days: 1

  full-stack:
    name: Shard ${{ matrix.shard }}/4 · ${{ matrix.queue }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each shard owns a fixed set of tiers, so a failure names its own reproduction command.
          - shard: 1
            queue: bdd
            command: npx bddgen && npx playwright test --project=bdd --workers=1 --reporter=blob
          # Same two exclusions as the cluster (deploy/k8s/tests/playwright-indexed-job.yaml), for the same
          # reasons, written down in docs/ci/ARCHITECTURE.md §4: the legacy parity captures need a retired
          # frontend on :4200, and three tests assert Firebase's own behaviour, which a public runner has no
          # credentials for.
          - shard: 2
            queue: integration-a
            command: npx playwright test e2e-tests/integration --project=chromium-desktop --shard=1/2 --workers=1 --reporter=blob --grep-invert="legacy|@needs-firebase"
          - shard: 3
            queue: integration-b
            command: npx playwright test e2e-tests/integration --project=chromium-desktop --shard=2/2 --workers=1 --reporter=blob --grep-invert="legacy|@needs-firebase"
          - shard: 4
            queue: scenarios+sandbox
            command: npx playwright test e2e-tests/scenarios e2e-tests/sandbox --project=chromium-desktop --workers=1 --reporter=blob
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
      backend:
        # The same image the kind cluster and the sandbox run; the runner waits for its readiness group.
        image: ghcr.io/check-it-out-dev/checkitout-backend:${{ inputs.backend_tag || 'main' }}
        env:
          SPRING_PROFILES_ACTIVE: dev-lite
          SPRING_DATASOURCE_HOST: postgres
          SPRING_DATASOURCE_PORT: "5432"
          SPRING_DATASOURCE_DATABASE: postgres
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: admin
          SPRING_DATA_REDIS_HOST: redis
          SPRING_DATA_REDIS_PORT: "6379"
          SPRING_LIQUIBASE_CONTEXTS: dev,local,dev-lite
          SERVER_PORT: "8080"
          TZ: UTC
          # The Firebase emulators run on the RUNNER, not as a service, because a service container
          # cannot be given a start command and no image ships the suite. The backend reaches them
          # through the docker host gateway, the same way the frontend container below reaches the
          # backend. They are not up yet when this service starts, which costs nothing: the Admin SDK
          # only records the addresses at init and the first call happens once the tests run.
          FIREBASE_AUTH_EMULATOR_HOST: host.docker.internal:9099
          FIRESTORE_EMULATOR_HOST: host.docker.internal:8085
          # The project id decides which emulator store the accounts land in, and the synthetic
          # offline credentials carry it too - seed one project and sign in against another and every
          # login is EMAIL_NOT_FOUND while the users plainly exist.
          FIREBASE_PROJECT_ID: demo-checkitout
          GCP_PROJECT_ID: demo-checkitout
          # TOTP secrets are sealed by Cloud KMS in production and by LocalTotpCipher when KMS is
          # off. There is no KMS here and there must not be, so the local cipher does it: an AES-GCM
          # key derived from this string, which is a test key for a throwaway emulator and seals
          # nothing that outlives the run.
          GCP_KMS_ENABLED: "false"
          TOTP_LOCAL_KEY: nightly-emulator-totp-key
        ports: ["8080:8080"]
        options: >-
          --add-host=host.docker.internal:host-gateway
          --health-cmd "wget -qO- http://127.0.0.1:8080/api/actuator/health/readiness | grep -q UP"
          --health-interval 10s --health-timeout 5s --health-retries 40 --health-start-period 60s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: browser-dist
          path: dist/check-it-out-fe-greenfield/browser

      # Sixteen ported scenarios sign in through Firebase rather than through the mock session -
      # OAuth with the profile the backend reads out of Firestore, email verification with a
      # password, the negative login paths. The backend's own tier stopped needing a credential when
      # it was pointed at the emulator suite; this gives the nightly the same thing, so those
      # scenarios run for real here instead of being excluded.
      # firebase-tools 15 refuses to start the Firestore emulator on anything below JDK 21, and the
      # runner image's default `java` is older. The backend's own tier never hit this because it sets
      # up a JDK for Maven anyway.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Firebase emulators and the three actors
        run: |
          set -euo pipefail
          npm install -g firebase-tools@15 --loglevel=error
          cat > /tmp/firebase.json <<'JSON'
          {
            "emulators": {
              "auth":      { "host": "0.0.0.0", "port": 9099 },
              "firestore": { "host": "0.0.0.0", "port": 8085 },
              "ui":        { "enabled": false }
            }
          }
          JSON
          firebase emulators:start --only auth,firestore --project demo-checkitout             --config /tmp/firebase.json > /tmp/emulators.log 2>&1 &
          FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099           FIRESTORE_EMULATOR_HOST=127.0.0.1:8085           FIREBASE_PROJECT_ID=demo-checkitout             node tools/ci/seed-firebase-emulator.mjs
      # `always()` for the same reason the backend log below says: the blob reporter does not
      # fail this job when tests fail, so `failure()` here could never fire. It stays quiet on a
      # healthy night -- only lines the emulators themselves flagged are printed, and the tail
      # follows only if there were any.
      - name: Emulator log
        if: always()
        run: |
          if [ ! -f /tmp/emulators.log ]; then echo 'the emulators never wrote a log'; exit 0; fi
          hits=$(grep -iE 'error|exception|refused|failed|denied' /tmp/emulators.log | tail -40 || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo '--- tail, for context ---'
            tail -60 /tmp/emulators.log
          else
            echo 'the emulators logged nothing that looks like a problem'
          fi

      - name: Frontend behind nginx, /api proxied to the backend service on the host
        run: |
          docker build -q -f deploy/k8s/frontend/Dockerfile -t checkitout-frontend:ci .
          docker run -d --name frontend -p 4300:80 --add-host=host.docker.internal:host-gateway \
            -e BACKEND_UPSTREAM=host.docker.internal:8080 -e COOKIE_FLAGS="nosecure samesite=lax" checkitout-frontend:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:4300/healthz && break; sleep 1; done
          curl -fsS http://localhost:4300/api/actuator/health | grep -q '"UP"' && echo "backend UP through nginx"
          curl -sS -D /tmp/h -o /dev/null -X POST http://localhost:4300/api/test/auth/mock-session \
            -H "Content-Type: application/json" -d '{"email":"smoke@checkitout.app","role":"COMPANY"}'
          grep -i "^set-cookie: session=" /tmp/h | grep -qiv secure && echo "session cookie without Secure: sign-in will work"

      # The 2FA scenarios need the suite and the application to agree on one secret. Rather than read
      # one back and decrypt it -- which is what needs Cloud KMS and a service account -- the run
      # provisions a secret it already knows, through the backend's own endpoint, so the application
      # seals it with the cipher configured above and the suite never decrypts anything. The endpoint
      # is idempotent and refuses to exist on the public sandbox.
      # The 2FA scenarios need the suite and the application to agree on one secret. Rather than read
      # one back and decrypt it -- which is what needs Cloud KMS and a service account -- the run
      # provisions a secret it already knows, through the backend's own endpoint, so the application
      # seals it with the cipher configured above and the suite never decrypts anything. The endpoint
      # is idempotent and refuses to exist on the public sandbox.
      #
      # It retries for three minutes, and it never fails the shard.
      #
      # Both numbers are the gRPC reconnect backoff. A service container starts before any step, so
      # the backend opens its Firestore channel against an emulator that does not exist yet; gRPC
      # then doubles its retry interval -- 1s, 2s, 4s ... to a two-minute ceiling -- and a call
      # arriving inside a long backoff fails instantly with UNAVAILABLE rather than waiting. Thirty
      # seconds of retries landed squarely in that window and reported failure while the very next
      # tests used Firestore happily. Three minutes covers the ceiling.
      #
      # Placed after the frontend container so the channel has that minute too, and non-fatal
      # because a seeding convenience must not be able to stop a tier that would otherwise run:
      # the scenarios that need the secret skip without it and say why.
      - name: The admin's TOTP secret, provisioned rather than decrypted
        run: |
          set -uo pipefail
          url=http://127.0.0.1:8080/api/test/auth/provision-totp
          payload=$(printf '{"firebaseUid":"%s","secret":"%s"}' "$ADMIN_FIREBASE_UID" "$E2E_TOTP_SECRET")
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/totp.json -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' -d "$payload" || echo 000)
            echo "attempt $attempt: provision-totp -> HTTP $code"
            [ "$code" = "200" ] && break
            [ "$code" = "404" ] && break
            sleep 15
          done
          cat /tmp/totp.json 2>/dev/null || true
          echo
          if [ "$code" = "200" ]; then
            echo "the admin's TOTP secret is in place"
          elif [ "$code" = "404" ]; then
            echo "::warning::this backend image has no /test/auth/provision-totp - the 2FA scenarios will skip"
          else
            echo "::warning::provision-totp answered $code after 12 attempts over three minutes - the 2FA scenarios will skip"
          fi

      - name: ${{ matrix.queue }}
        run: ${{ matrix.command }}
        env:
          CI: "1"
          PW_EXTERNAL_SERVER: "1"
          PW_BASE_URL: http://localhost:4300
          BE_URL: http://localhost:8080
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        continue-on-error: true

      # After the tests, not before them. This block sat above the test step and captured a log
      # that stopped at startup -- which is why an investigation into a 401 during the run found
      # no request in it at all. There was also a second copy below, conditioned on failure(),
      # which a blob-reporting shard never satisfies; it has been removed rather than fixed,
      # because one capture that always runs is the whole requirement.
      # The backend runs as a service container, so its log is not in this job's output and a failure
      # inside it reads only as an HTTP 500 in a test. Several scenarios fail with
      # `error.network.external_service`, which is the backend saying it could not reach something --
      # and which something is a question only its own log answers.
      #
      # `always()`, not `failure()`, and that distinction cost a run: the blob reporter does not fail
      # this job when tests fail. The shards all end green and the merge job downstream decides the
      # verdict, so a step conditioned on this job failing can never run. What is printed is a grep
      # first; the tail only follows if the grep found something, so a healthy night stays readable.
      - name: Backend log
        if: always()
        run: |
          id=$(docker ps -a --filter "ancestor=ghcr.io/check-it-out-dev/checkitout-backend:${{ inputs.backend_tag || 'main' }}" --format '{{.ID}}' | head -1)
          if [ -z "$id" ]; then
            id=$(docker ps -a --format '{{.ID}} {{.Image}}' | grep checkitout-backend | head -1 | cut -d' ' -f1)
          fi
          if [ -z "$id" ]; then echo "no backend container found to read a log from"; exit 0; fi
          echo "### Backend: what it said about reaching anything"
          # The whole log, kept as an artifact. Three nightly failures in a row have been diagnosed
          # by reading it, and each time the grep below turned out not to match the interesting line
          # -- a 401 is not "external_service", and the gRPC channel panic that caused nine failures
          # said "Uncaught exception in the SynchronizationContext", which no pattern here would have
          # caught. Grepping is for the step summary; the artifact is for the next question.
          docker logs "$id" > /tmp/backend.log 2>&1 || true
          echo "backend log: $(wc -l < /tmp/backend.log) lines"
          hits=$(grep -iE "emulator|identitytoolkit|securetoken|firestore|external_service|Connection refused|UnknownHost|NetworkTranslatable|not_authenticated|Uncaught exception|rate_limit" /tmp/backend.log | tail -60 || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            {
              echo "### Backend: emulator and external-call lines"
              echo '```'
              echo "$hits"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "--- tail, for context ---"
            tail -80 /tmp/backend.log
          else
            echo "nothing about emulators or external calls in the backend log"
          fi

      - name: Keep the backend log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-log-${{ matrix.shard }}
          path: /tmp/backend.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: nightly-blob-${{ matrix.shard }}
          path: |
            blob-report
            backend-${{ matrix.shard }}.log
          retention-days: 7
          if-no-files-found: warn

  merge:
    name: One report, one verdict
    needs: [full-stack]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: nightly-blob-*
          path: fragments
          merge-multiple: true
      - name: Merge
        run: |
          mkdir -p ci-reports/blobs
          find fragments -name '*.zip' -exec cp {} ci-reports/blobs/ \;
          PLAYWRIGHT_HTML_OUTPUT_DIR=ci-reports/merged PLAYWRIGHT_HTML_REPORT=ci-reports/merged PLAYWRIGHT_JSON_OUTPUT_NAME=ci-reports/merged.json \
            npx playwright merge-reports --reporter html,json ci-reports/blobs
      # The verdict is recorded here but does not stop the job: a red or an incomplete run must still publish
      # its numbers, or the dashboard can only ever show the last green run. The job is failed at the very end.
      - name: Verdict
        id: verdict
        continue-on-error: true
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: set -o pipefail; node tools/ci/k8s-summary.mjs ci-reports --needs "$NEEDS" --json ci-reports/summary.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: nightly-report-${{ github.run_number }}
          path: |
            ci-reports
            !ci-reports/blobs
          retention-days: 30
      - name: Pages site (previous state)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      # Allure reads the SAME blobs a second time, through allure-playwright, so the report carries the
      # Playwright steps, attachments and retries rather than a JUnit summary. Allure 3 keeps history in a
      # single history.jsonl named by allurerc.mjs - there is no history/ directory any more - so the file
      # is carried on the Pages site, one per workflow: browser-tiers and k8s run different suites and a
      # shared history would call every test of the other suite "new" on every run.
      - name: Allure 3 (the same blobs, history from the site)
        # The report is a nice-to-have; the verdict below is what decides the job. A failure here
        # must never stop the dashboard and the metrics from being published.
        continue-on-error: true
        run: |
          set -o pipefail
          cp "site/allure/history-nightly-full-stack.jsonl" history.jsonl 2>/dev/null || true
          npx playwright merge-reports --reporter allure-playwright ci-reports/blobs
          npx --yes allure generate --config allurerc.mjs ./allure-results --output allure-report
          mkdir -p site/allure && cp history.jsonl "site/allure/history-nightly-full-stack.jsonl"
      - name: Quality metrics into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p site && rm -rf site/.git
          STARTED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          DURATION=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
          node tools/ci/quality-metrics.mjs --out site --workflow nightly-full-stack --started-at "$STARTED_AT" --duration-sec "$DURATION" \
            --playwright ci-reports/merged.json --verdict ci-reports/summary.json --copy playwright=ci-reports/merged \
            --jest site/jest/latest.json --coverage site/coverage/latest.json --lighthouse site/lighthouse/latest.json --mutation site/mutation/latest.json --security site/security/latest.json --copy allure=allure-report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A retrying overlay push rather than the action, because several tiers publish in parallel
        # now and the loser of the race used to drop its whole report. See the script's header.
        run: |
          bash tools/ci/publish-pages.sh site "nightly-full-stack run ${{ github.run_number }}"
      - name: The verdict decides the job
        if: always() && steps.verdict.outcome == 'failure'
        run: |
          STATUS=$(node -p "try{require('./ci-reports/summary.json').status}catch{'red'}")
          echo "Verdict: $STATUS. The report was published; the job is failed so nothing reads it as green." >&2
          exit 1

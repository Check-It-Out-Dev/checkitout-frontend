# The full stack every night, without a cluster: the backend image from ghcr.io on the dev-lite profile as
# a service container next to Postgres and Redis, the production frontend build behind the same nginx image
# the kind cluster uses (cookies re-flagged for plain http), and the browser tiers that need a live backend
# split across four runners: the Cucumber-oracle tier, the integration tier in two halves, and the
# scenarios with the sandbox tier. Every shard writes a blob report; the merge job makes one report and one
# verdict (tools/ci/k8s-summary.mjs). GreenMail is in-JVM on dev-lite, so no mailbox container is needed.
# The same tiers run on Kubernetes weekly (k8s-test-execution.yml); this is the fifteen-minute daily version.
name: Frontend CI - Nightly Full Stack (sharded)

on:
  workflow_call:
  workflow_dispatch:


# The group is keyed by the CALLING pipeline as well as the ref. Without `github.workflow` --
# which under workflow_call is the caller's name -- a push to main starts `pr`, `pr` calls this
# tier, and it cancels the copy the night is already running. That happened on the first night:
# three shards cancelled mid-run and the verdict correctly called the night incomplete.
concurrency:
  group: nightly-full-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NG_CLI_ANALYTICS: "false"
  NODE_OPTIONS: "--max-old-space-size=4096"
  BACKEND_TAG: ${{ inputs.backend_tag || 'main' }}

jobs:
  build:
    name: Production build (once, shared by the shards)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: browser-dist
          path: dist/check-it-out-fe-greenfield/browser
          retention-days: 1

  full-stack:
    name: Shard ${{ matrix.shard }}/4 · ${{ matrix.queue }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each shard owns a fixed set of tiers, so a failure names its own reproduction command.
          - shard: 1
            queue: bdd
            command: npx bddgen && npx playwright test --project=bdd --workers=1 --reporter=blob
          # Same two exclusions as the cluster (deploy/k8s/tests/playwright-indexed-job.yaml), for the same
          # reasons, written down in docs/ci/ARCHITECTURE.md §4: the legacy parity captures need a retired
          # frontend on :4200, and three tests assert Firebase's own behaviour, which a public runner has no
          # credentials for.
          - shard: 2
            queue: integration-a
            command: npx playwright test e2e-tests/integration --project=chromium-desktop --shard=1/2 --workers=1 --reporter=blob --grep-invert="legacy|@needs-firebase"
          - shard: 3
            queue: integration-b
            command: npx playwright test e2e-tests/integration --project=chromium-desktop --shard=2/2 --workers=1 --reporter=blob --grep-invert="legacy|@needs-firebase"
          - shard: 4
            queue: scenarios+sandbox
            command: npx playwright test e2e-tests/scenarios e2e-tests/sandbox --project=chromium-desktop --workers=1 --reporter=blob
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
      backend:
        # The same image the kind cluster and the sandbox run; the runner waits for its readiness group.
        image: ghcr.io/check-it-out-dev/checkitout-backend:${{ inputs.backend_tag || 'main' }}
        env:
          SPRING_PROFILES_ACTIVE: dev-lite
          SPRING_DATASOURCE_HOST: postgres
          SPRING_DATASOURCE_PORT: "5432"
          SPRING_DATASOURCE_DATABASE: postgres
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: admin
          SPRING_DATA_REDIS_HOST: redis
          SPRING_DATA_REDIS_PORT: "6379"
          SPRING_LIQUIBASE_CONTEXTS: dev,local,dev-lite
          SERVER_PORT: "8080"
          TZ: UTC
          # The Firebase emulators run on the RUNNER, not as a service, because a service container
          # cannot be given a start command and no image ships the suite. The backend reaches them
          # through the docker host gateway, the same way the frontend container below reaches the
          # backend. They are not up yet when this service starts, which costs nothing: the Admin SDK
          # only records the addresses at init and the first call happens once the tests run.
          FIREBASE_AUTH_EMULATOR_HOST: host.docker.internal:9099
          FIRESTORE_EMULATOR_HOST: host.docker.internal:8085
          # The project id decides which emulator store the accounts land in, and the synthetic
          # offline credentials carry it too - seed one project and sign in against another and every
          # login is EMAIL_NOT_FOUND while the users plainly exist.
          FIREBASE_PROJECT_ID: demo-checkitout
          GCP_PROJECT_ID: demo-checkitout
        ports: ["8080:8080"]
        options: >-
          --add-host=host.docker.internal:host-gateway
          --health-cmd "wget -qO- http://127.0.0.1:8080/api/actuator/health/readiness | grep -q UP"
          --health-interval 10s --health-timeout 5s --health-retries 40 --health-start-period 60s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          name: browser-dist
          path: dist/check-it-out-fe-greenfield/browser

      # Sixteen ported scenarios sign in through Firebase rather than through the mock session -
      # OAuth with the profile the backend reads out of Firestore, email verification with a
      # password, the negative login paths. The backend's own tier stopped needing a credential when
      # it was pointed at the emulator suite; this gives the nightly the same thing, so those
      # scenarios run for real here instead of being excluded.
      # firebase-tools 15 refuses to start the Firestore emulator on anything below JDK 21, and the
      # runner image's default `java` is older. The backend's own tier never hit this because it sets
      # up a JDK for Maven anyway.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Firebase emulators and the three actors
        run: |
          set -euo pipefail
          npm install -g firebase-tools@15 --loglevel=error
          cat > /tmp/firebase.json <<'JSON'
          {
            "emulators": {
              "auth":      { "host": "0.0.0.0", "port": 9099 },
              "firestore": { "host": "0.0.0.0", "port": 8085 },
              "ui":        { "enabled": false }
            }
          }
          JSON
          firebase emulators:start --only auth,firestore --project demo-checkitout             --config /tmp/firebase.json > /tmp/emulators.log 2>&1 &
          FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099           FIRESTORE_EMULATOR_HOST=127.0.0.1:8085           FIREBASE_PROJECT_ID=demo-checkitout             node tools/ci/seed-firebase-emulator.mjs
      - name: Emulator log on failure
        if: failure()
        run: tail -60 /tmp/emulators.log || true

      - name: Frontend behind nginx, /api proxied to the backend service on the host
        run: |
          docker build -q -f deploy/k8s/frontend/Dockerfile -t checkitout-frontend:ci .
          docker run -d --name frontend -p 4300:80 --add-host=host.docker.internal:host-gateway \
            -e BACKEND_UPSTREAM=host.docker.internal:8080 -e COOKIE_FLAGS="nosecure samesite=lax" checkitout-frontend:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:4300/healthz && break; sleep 1; done
          curl -fsS http://localhost:4300/api/actuator/health | grep -q '"UP"' && echo "backend UP through nginx"
          curl -sS -D /tmp/h -o /dev/null -X POST http://localhost:4300/api/test/auth/mock-session \
            -H "Content-Type: application/json" -d '{"email":"smoke@checkitout.app","role":"COMPANY"}'
          grep -i "^set-cookie: session=" /tmp/h | grep -qiv secure && echo "session cookie without Secure: sign-in will work"

      - name: ${{ matrix.queue }}
        run: ${{ matrix.command }}
        env:
          CI: "1"
          PW_EXTERNAL_SERVER: "1"
          PW_BASE_URL: http://localhost:4300
          BE_URL: http://localhost:8080
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        continue-on-error: true

      - name: Backend log on failure
        if: failure()
        run: docker logs ${{ job.services.backend.id }} > backend-${{ matrix.shard }}.log 2>&1 || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-blob-${{ matrix.shard }}
          path: |
            blob-report
            backend-${{ matrix.shard }}.log
          retention-days: 7
          if-no-files-found: warn

  merge:
    name: One report, one verdict
    needs: [full-stack]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error
      - uses: actions/download-artifact@v7
        with:
          pattern: nightly-blob-*
          path: fragments
          merge-multiple: true
      - name: Merge
        run: |
          mkdir -p ci-reports/blobs
          find fragments -name '*.zip' -exec cp {} ci-reports/blobs/ \;
          PLAYWRIGHT_HTML_OUTPUT_DIR=ci-reports/merged PLAYWRIGHT_HTML_REPORT=ci-reports/merged PLAYWRIGHT_JSON_OUTPUT_NAME=ci-reports/merged.json \
            npx playwright merge-reports --reporter html,json ci-reports/blobs
      # The verdict is recorded here but does not stop the job: a red or an incomplete run must still publish
      # its numbers, or the dashboard can only ever show the last green run. The job is failed at the very end.
      - name: Verdict
        id: verdict
        continue-on-error: true
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: set -o pipefail; node tools/ci/k8s-summary.mjs ci-reports --needs "$NEEDS" --json ci-reports/summary.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-report-${{ github.run_number }}
          path: |
            ci-reports
            !ci-reports/blobs
          retention-days: 30
      - name: Pages site (previous state)
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      # Allure reads the SAME blobs a second time, through allure-playwright, so the report carries the
      # Playwright steps, attachments and retries rather than a JUnit summary. Allure 3 keeps history in a
      # single history.jsonl named by allurerc.mjs - there is no history/ directory any more - so the file
      # is carried on the Pages site, one per workflow: browser-tiers and k8s run different suites and a
      # shared history would call every test of the other suite "new" on every run.
      - name: Allure 3 (the same blobs, history from the site)
        # The report is a nice-to-have; the verdict below is what decides the job. A failure here
        # must never stop the dashboard and the metrics from being published.
        continue-on-error: true
        run: |
          set -o pipefail
          cp "site/allure/history-nightly-full-stack.jsonl" history.jsonl 2>/dev/null || true
          npx playwright merge-reports --reporter allure-playwright ci-reports/blobs
          npx --yes allure generate --config allurerc.mjs ./allure-results --output allure-report
          mkdir -p site/allure && cp history.jsonl "site/allure/history-nightly-full-stack.jsonl"
      - name: Quality metrics into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p site && rm -rf site/.git
          STARTED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          DURATION=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
          node tools/ci/quality-metrics.mjs --out site --workflow nightly-full-stack --started-at "$STARTED_AT" --duration-sec "$DURATION" \
            --playwright ci-reports/merged.json --verdict ci-reports/summary.json --copy playwright=ci-reports/merged \
            --jest site/jest/latest.json --coverage site/coverage/latest.json --lighthouse site/lighthouse/latest.json --copy allure=allure-report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A retrying overlay push rather than the action, because several tiers publish in parallel
        # now and the loser of the race used to drop its whole report. See the script's header.
        run: |
          bash tools/ci/publish-pages.sh site "nightly-full-stack run ${{ github.run_number }}"
      - name: The verdict decides the job
        if: always() && steps.verdict.outcome == 'failure'
        run: |
          STATUS=$(node -p "try{require('./ci-reports/summary.json').status}catch{'red'}")
          echo "Verdict: $STATUS. The report was published; the job is failed so nothing reads it as green." >&2
          exit 1

# OWASP Top 10 coverage, as a build step.
#
# What already existed covered part of it by accident rather than by design: CodeQL reaches A01, A03,
# A08 and A10; Dependabot and dependency-review cover A06; secret scanning covers hardcoded
# credentials. Nothing covered A02, A04, A05, A07 or A09 as a gate, and nothing at all pointed a
# scanner at the RUNNING application — there was no dynamic testing of any kind.
#
#   Semgrep   p/owasp-top-ten across the whole surface, plus secrets and typescript rulesets
#   Trivy     the filesystem and the published image: CVEs in what actually ships       A06 A08
#   Checkov   the Kubernetes manifests, Dockerfiles, compose files and workflows        A05
#   Syft      an SBOM for the image, attached to the run                                A08
#   ZAP       a baseline scan against the live sandbox — the only layer that tests
#             the running system, and the only one that can see a missing security
#             header or a cookie without Secure                                     A02 A05 A07
#
# Everything here is free and open source. Every scanner writes SARIF into GitHub code scanning, so
# the Security tab stays the single place to look rather than five different report formats.
#
# Tools are installed at pinned versions rather than pulled through marketplace actions on purpose:
# `actions/unpinned-tag` is one of the findings this pipeline is meant to fix, and adding fourteen
# more floating tags to fix it would be an odd way to go about it.
name: security

on:
  workflow_call:
  workflow_dispatch:


# The group is keyed by the CALLING pipeline as well as the ref. Without `github.workflow` --
# which under workflow_call is the caller's name -- a push to main starts `pr`, `pr` calls this
# tier, and it cancels the copy the night is already running. That happened on the first night:
# three shards cancelled mid-run and the verdict correctly called the night incomplete.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  # The caller's event, because under workflow_call that is whose event it is: a superseded
  # pull-request run is waste, but a superseded push to main loses the record of what main
  # did, and a night is never worth cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

env:
  SEMGREP_VERSION: "1.148.0"
  CHECKOV_VERSION: "3.2.492"
  TRIVY_VERSION: "0.74.0"

jobs:
  sast:
    name: Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
      # --error is deliberately absent: the SARIF upload is the gate, and code scanning already
      # decides severity. A scanner that fails the build on its own opinion of severity ends up
      # disabled within a fortnight.
      - name: Scan
        run: |
          # --exclude-rule for the nginx one, the same decision the backend repository made and for
          # the same reason: the finding is `proxy_set_header Host $host`, which is how an upstream
          # learns which vhost was asked for, and the default server already refuses an unknown
          # Host. A `# nosemgrep` comment cannot express it -- nosemgrep needs to know the file's
          # comment syntax and an nginx config is matched in generic mode, where it does not.
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/typescript \
            --sarif --output semgrep.sarif \
            --metrics off \
            --exclude-rule generic.nginx.security.request-host-used.request-host-used \
            --exclude node_modules --exclude dist --exclude coverage \
            --exclude 'src/app/api/**' --exclude '*-snapshots' \
            . || true
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("semgrep.sarif"))
          runs = r.get("runs", [])
          n = sum(len(x.get("results", [])) for x in runs)
          print(f"### Semgrep\n\n{n} finding(s) across the OWASP, secrets and TypeScript rule sets.")
          PY
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: semgrep.sarif
          # The category IS the identity of an analysis stream, and every upload below names one.
          # Without a category GitHub derives the key from the workflow file and job id, so the same
          # scanner uploading from security.yml and from nightly.yml becomes two streams that can
          # never close each other's alerts - and renaming a workflow orphans a stream for good.
          # That is where 170 of this repository's open alerts came from: findings fixed weeks ago,
          # held open by a stream with nothing left to re-scan them.
          category: semgrep
      # Kept as an artifact as well as uploaded to code scanning, so the summary job below can
      # count what every tool found in ONE run. Code scanning answers "what is open"; this answers
      # "what did tonight's scan see", which is the number worth trending.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          retention-days: 30
          if-no-files-found: ignore
          category: semgrep

  iac:
    name: Checkov (manifests, images, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "checkov==${CHECKOV_VERSION}"
      # A05 is the category nothing else here reaches: a container running as root, a manifest with
      # no resource limits, a workflow with a token it does not need.
      - name: Scan
        run: |
          checkov --directory . \
            --framework kubernetes,dockerfile,github_actions,secrets \
            --skip-path node_modules --skip-path dist --skip-path coverage \
            --output sarif --output-file-path . \
            --soft-fail || true
          if [ -f results.sarif ]; then mv results.sarif checkov.sarif; fi
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("checkov.sarif"))
          n = sum(len(x.get("results", [])) for x in r.get("runs", []))
          print(f"### Checkov\n\n{n} misconfiguration(s) in manifests, images and workflows.")
          PY
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        if: hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov
      # Kept as an artifact as well as uploaded to code scanning, so the summary job below can
      # count what every tool found in ONE run. Code scanning answers "what is open"; this answers
      # "what did tonight's scan see", which is the number worth trending.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: sarif-checkov
          path: checkov.sarif
          retention-days: 30
          if-no-files-found: ignore
          category: checkov

  supply-chain:
    name: Trivy and an SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Trivy
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          # --fail-with-body, not a bare -f: a 404 page piped into tar dies with
          # "Error is not recoverable", which says nothing about the version being wrong. It was.
          curl -sSL --fail-with-body -o /tmp/trivy.tgz "$url"
          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version
      # The lockfile is what Dependabot reads; this reads the same tree for CVEs Dependabot has not
      # opened a pull request for yet, and writes an SBOM of what is actually there.
      - name: Filesystem CVEs
        run: |
          # --ignorefile is not optional here. Trivy auto-discovers a plain `.trivyignore`; the YAML
          # form -- the only one that can carry a path scope and a reason per entry -- has to be
          # named. Without the flag the file is simply not read: the scan reported the same 47
          # misconfigurations with the exemptions sitting in the repository beside it.
          trivy fs . --scanners vuln,secret,misconfig \
            --ignorefile .trivyignore.yaml \
            --skip-dirs node_modules,dist,coverage,.angular \
            --format sarif --output trivy.sarif --exit-code 0
          trivy fs . --format cyclonedx --output sbom.cdx.json --skip-dirs node_modules,dist,coverage
          {
            echo "### Trivy"
            echo
            trivy fs . --scanners vuln --skip-dirs node_modules,dist,coverage,.angular \
              --format table --severity HIGH,CRITICAL --exit-code 0 2>/dev/null | tail -25
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: trivy.sarif
          category: trivy
      # Kept as an artifact as well as uploaded to code scanning, so the summary job below can
      # count what every tool found in ONE run. Code scanning answers "what is open"; this answers
      # "what did tonight's scan see", which is the number worth trending.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: sarif-trivy
          path: trivy.sarif
          retention-days: 30
          if-no-files-found: ignore
          category: trivy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ github.run_number }}
          path: sbom.cdx.json
          retention-days: 90

  dast:
    name: ZAP baseline against the live sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only against a deployment that exists: a pull request has nothing running to point at, and the
    # sandbox is the one public surface running the real stack.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The baseline scan is passive: it crawls, reads what comes back, and reports missing headers,
      # cookie flags, information disclosure and the like. It sends no attack payloads, which is what
      # makes it safe to point at a live host on a schedule.
      - name: Scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://checkitout.app/sandbox/ \
              -J report.json -w report.md -I -m 3 || true
          {
            echo "### OWASP ZAP baseline"
            echo
            if [ -f zap/report.md ]; then head -60 zap/report.md; else echo "no report produced"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: zap-${{ github.run_number }}
          path: zap/
          retention-days: 30

  summary:
    name: What the scanners found, in one number
    needs: [sast, iac, supply-chain]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Writes the count to the Pages branch so the dashboard can trend security quality over time.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Collect the SARIF every tool produced
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
        continue-on-error: true

      - name: Count it
        run: |
          set -o pipefail
          node tools/ci/sarif-summary.mjs "sarif/*.sarif" --json security-summary.json             | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pages site (previous state)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      - name: This tier's number into the site, for the dashboard to trend
        run: |
          rm -rf site/.git
          mkdir -p site/security
          cp security-summary.json site/security/latest.json
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/ci/publish-pages.sh site "security run ${{ github.run_number }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: security-summary-${{ github.run_number }}
          path: security-summary.json
          retention-days: 90

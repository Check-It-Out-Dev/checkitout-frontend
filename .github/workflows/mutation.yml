# Stryker: would the tests notice if the code were wrong?
#
# Coverage answers a weaker question than most dashboards imply. It says a line executed during a
# test run - not that anything checked the result. Mutation testing changes the code on purpose,
# one small edit at a time, and reports which edits the suite failed to catch. Every survivor is a
# line that could break tomorrow with every gate still green.
#
# It runs at night rather than on pull requests because it is minutes rather than seconds, and
# because its output is a reading list, not a merge decision. Scope, and the two Angular-specific
# settings that make Stryker run at all, are in stryker.conf.json.
name: mutation

on:
  workflow_call:
    inputs:
      floor:
        description: Fail below this mutation score. A ratchet - raise it, never lower it.
        type: number
        default: 70
  workflow_dispatch:
    inputs:
      floor:
        description: Fail below this mutation score
        type: number
        default: 70

# The group is keyed by the CALLING pipeline as well as the ref. Without `github.workflow` --
# which under workflow_call is the caller's name -- a push to main starts `pr`, `pr` calls this
# tier, and it cancels the copy the night is already running. That happened on the first night:
# three shards cancelled mid-run and the verdict correctly called the night incomplete.
concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  # The caller's event, because under workflow_call that is whose event it is: a superseded
  # pull-request run is waste, but a superseded push to main loses the record of what main
  # did, and a night is never worth cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# contents: write because this tier writes its score to the Pages branch for the dashboard.
permissions:
  contents: write

jobs:
  stryker:
    name: Stryker
    runs-on: ubuntu-latest
    # Measured at 7 minutes on the dev box over 486 mutants with two workers. The limit is set
    # well above that so a slow runner reports a score rather than a cancellation.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error

      # Two notes, both earned.
      #
      # `inPlace` rewrites the working tree as it goes and restores it afterwards. On a fresh
      # checkout that is free; see the note in stryker.conf.json for why it is not optional.
      #
      # `npm run`, not `npx`. npx does not fail when a binary is missing -- it goes to the registry
      # and installs whatever carries that name. With the devDependencies briefly absent from
      # package.json, `npx stryker` quietly fetched stryker@1.0.1 from 2019 and died inside it on a
      # missing `rx` module. npm run resolves the local bin or says plainly that it cannot.
      - name: Mutate
        run: npm run test:mutation -- --fileLogLevel off

      # Separate step so the report is published and the survivors are listed even when the score
      # is under the floor. Stryker's own `break` would fail the job before either happened.
      - name: What survived
        if: always()
        # Through env, not interpolated. A dispatch input is typed by a person, and a person
        # can type `$(...)`, which the shell expands before the tool sees an argument.
        env:
          FLOOR: ${{ inputs.floor || 70 }}
        run: |
          set -o pipefail
          node tools/ci/mutation-summary.mjs \
            --break "$FLOOR" \
            --json mutation-summary.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pages site (previous state)
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      - name: This tier's number into the site, for the dashboard to trend
        if: always()
        run: |
          rm -rf site/.git
          mkdir -p "site/mutation"
          cp mutation-summary.json "site/mutation/latest.json"
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A retrying overlay push rather than the action, because several tiers publish in parallel
        # and the loser of the race used to drop its result. See the script's header.
        run: |
          bash tools/ci/publish-pages.sh site "mutation run ${{ github.run_number }}"

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-${{ github.run_number }}
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json
            mutation-summary.json
          retention-days: 90

---
# Frontend CI — the quality-gate wall on every PR and mainline push.
#
# This is the SAME wall the pre-commit hook runs locally (`check:full`,
# G1..G14 in README → Gates): eleven static gates, strict typecheck for the
# app + e2e configs, the `ng build` template type-check (strictTemplates
# only fires there), and the full jest suite. Hermetic by design — no
# backend, no browsers, no Docker — so it runs identically on GitHub-hosted
# runners and on fork PRs (which is also why this workflow does NOT use the
# self-hosted deploy runner: fork PR code must never execute on our infra).
#
# Two gates degrade gracefully in a single-repo checkout:
#   - G7 bdd-corpus self-skips (loudly) when the sibling checkitout-backend
#     checkout is absent — it measures completeness against the BE Cucumber
#     corpus, which only exists on a dev machine.
#   - G5 baseline-freshness compares file mtimes, which a fresh checkout
#     resets wholesale; the tag is touched first so the gate measures real
#     staleness only where mtimes are real (locally, at pre-commit).
#
# Deliberately NOT here (documented deferrals):
#   - visual / visual-parity tiers: byte-stable PNG baselines are captured
#     on the dev platform; a Linux runner rasterizes different pixels.
#   - integration / scenarios / BDD tiers: need the live BE + Postgres +
#     Redis + GreenMail — they land in a separate full-stack workflow.
name: Frontend CI - Quality Gates

on:
  workflow_call:
  workflow_dispatch:


# The group is keyed by the CALLING pipeline as well as the ref. Without `github.workflow` --
# which under workflow_call is the caller's name -- a push to main starts `pr`, `pr` calls this
# tier, and it cancels the copy the night is already running. That happened on the first night:
# three shards cancelled mid-run and the verdict correctly called the night incomplete.
concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  # The caller's event, because under workflow_call that is whose event it is: a superseded
  # pull-request run is waste, but a superseded push to main loses the record of what main
  # did, and a night is never worth cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NG_CLI_ANALYTICS: "false"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  quality-gates:
    name: Gate wall (G1..G14)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: ⚙️ Setup Node.js (from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit --loglevel=error

      - name: 🕐 Reset the G5 mtime tag (fresh checkout has no real mtimes)
        run: touch e2e-tests/visual/sandbox-snapshots.spec.ts-snapshots/.last-regen.txt

      # The publisher is a shell script that deletes directories on a branch the whole estate
      # reads. Two seconds against a local bare repository, every run: it asserts that `latest`
      # is replaced rather than merged, that retention keeps exactly the newest reports, and
      # that another tier's directories are still left alone.
      - name: 🗂️ The Pages publisher still behaves
        run: bash tools/ci/publish-pages.test.sh tools/ci/publish-pages.sh

      - name: 🛡️ Static gates (G1..G11)
        run: npm run check:static

      - name: 🔎 Strict typecheck — app + e2e (G12)
        run: |
          npm run typecheck
          npm run typecheck:e2e

      - name: 🏗️ Template type-check build (G13)
        run: npm run build:check

      # Coverage runs HERE and not in the pre-commit hook: instrumenting 131
      # suites costs ~12 s on top of the run, which is the wrong trade at the
      # keyboard and the right one on a runner. The threshold in jest.config.js
      # is a ratchet set two points under the measured figure — it exists to
      # catch a slide, not to be admired.
      # Armed: the probe hook records what every test exercised (reports/subsume/), which is
      # what the invariants job below judges the change on.
      - name: 🧪 Unit tests + coverage threshold (G14)
        env:
          SUBSUME_PROBES: "1"
        run: |
          npm test -- --bail --ci --coverage --json --outputFile=jest-results.json
          node tools/subsume/merge-probes.mjs reports/subsume

      - name: 📤 Probes artifact (for the invariants job)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unit-probes
          path: |
            reports/subsume/probes.jsonl
            reports/subsume/maps.json
            jest-results.json
          retention-days: 14
          if-no-files-found: warn

      # No escape sequences anywhere in this script on purpose: it lives inside a
      # YAML block scalar inside a single-quoted shell string, and a backslash-n
      # that survives one layer and not the next produces a workflow that does
      # not parse. Blank lines are printed, not escaped.
      - name: 📈 Coverage into the run summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const out = [];
              out.push("### Coverage");
              out.push("");
              out.push("| metric | % | covered |");
              out.push("| --- | ---: | ---: |");
              for (const k of ["lines", "statements", "branches", "functions"]) {
                out.push("| " + k + " | " + t[k].pct.toFixed(2) + " % | " + t[k].covered + "/" + t[k].total + " |");
              }
              console.log(out.join(String.fromCharCode(10)));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📤 Coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: 📋 Summary
        if: always()
        # Through env, not interpolated. `github.ref_name` is a branch name, and a branch name
        # is whatever the person who opened the pull request typed - including `$(...)`, which
        # a shell expands before echo ever sees it. The others are GitHub's own values and are
        # here for consistency: a rule with exceptions is a rule nobody applies.
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "========================================="
          echo "QUALITY GATES SUMMARY"
          echo "========================================="
          echo "Ref: $REF_NAME"
          echo "Commit: $COMMIT_SHA"
          echo "Status: $JOB_STATUS"
          if [ "$JOB_STATUS" = "success" ]; then
              echo "✅ Gate wall green — same bar as the local pre-commit hook."
          else
              echo "❌ Gate wall failed — run 'npm run check:full' locally;"
              echo "   every gate prints its own fix hint."
          fi

      # The newest unit results and coverage go to the Pages site, where the browser-tier runs fold them
      # into the run they publish (docs/ci/METRICS.md section 7). Pushes only: a fork's pull request has no token.
      - name: Pages site (previous state)
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      - name: The latest unit results and coverage into the site
        if: github.event_name == 'push'
        run: |
          mkdir -p site/jest site/coverage && rm -rf site/.git
          cp jest-results.json site/jest/latest.json
          cp coverage/coverage-summary.json site/coverage/latest.json
      - name: Publish
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A retrying overlay push rather than the action, because several tiers publish in parallel
        # now and the loser of the race used to drop its whole report. See the script's header.
        run: |
          bash tools/ci/publish-pages.sh site "ci-tests run ${{ github.run_number }}: unit results and coverage"

  # The invariants of the test population, on every change (docs/ci/ADR-test-subsumption.md):
  # coverage never lower on a file, class or method this change did not touch, no mutant killed on
  # base left unkilled, the suite green, the published numbers consistent — judged from this run's
  # own probes against the base artefacts the last governance run published. Until the first
  # governance run publishes `subsume/latest`, the verdict is INCOMPLETE and the job says so
  # without blocking; FAIL always blocks. A governance branch gets the fuller re-measurement in
  # test-governance-pr.yml instead of this.
  invariants:
    name: Invariants of the test population
    needs: quality-gates
    if: ${{ !startsWith(github.head_ref, 'test-governance/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PAGES: https://check-it-out-dev.github.io/checkitout-frontend
      BASE_REF: ${{ github.base_ref }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: unit-probes
          path: head
      - name: Base artefacts of the last governance run
        run: |
          mkdir -p base base2 && cd base
          for f in probes.jsonl maps.json mutation.json; do
            curl -fsSL "$PAGES/subsume/latest/$f.gz" -o "$f.gz" && gunzip -f "$f.gz" || echo "::warning::$f is not on Pages yet — the verdict will be INCOMPLETE"
          done
          curl -fsSL "$PAGES/subsume/latest/probes2.jsonl.gz" -o ../base2/probes.jsonl.gz && gunzip -f ../base2/probes.jsonl.gz && cp maps.json ../base2/ 2>/dev/null || true
      - name: What this change touched
        run: |
          if [ -n "$BASE_REF" ]; then git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          else git diff --name-only HEAD~1...HEAD > changed.txt 2>/dev/null || : > changed.txt; fi
          wc -l < changed.txt
      - name: The published numbers are still the measured ones (I4)
        id: numbers
        run: node tools/check-published-numbers.mjs && echo "i4=pass" >> "$GITHUB_OUTPUT" || echo "i4=fail" >> "$GITHUB_OUTPUT"
      - name: Invariants I1–I4
        env:
          I4: ${{ steps.numbers.outputs.i4 }}
        run: |
          set +e
          node tools/subsume/invariant.mjs --repo frontend --base base --base2 base2 --head head/reports/subsume             --changed changed.txt --suite head/jest-results.json --i4 "$I4"             --head-commit "$HEAD_SHA" --out reports/subsume
          code=$?
          set -e
          # 0 PASS, 1 FAIL, 2 INCOMPLETE: only FAIL blocks — an INCOMPLETE verdict is printed, never hidden
          if [ "$code" = "1" ]; then exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: invariants
          path: reports/subsume/invariant-report.json
          if-no-files-found: warn
          retention-days: 30

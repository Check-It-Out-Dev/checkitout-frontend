# Lighthouse against the served demo build: three runs per page, desktop preset, the category scores
# asserted at warn level (they become errors once the history shows what the p90 is), HTML reports as an
# artifact and a scores table in the step summary via tools/ci/lighthouse-summary.mjs. Configuration in
# lighthouserc.json at the repository root.
name: lighthouse

on:
  workflow_call:
  workflow_dispatch:


concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NG_CLI_ANALYTICS: "false"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  lighthouse:
    name: Demo build, three pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error
      - run: npm run build:demo
      - name: Serve the demo build on 4300
        run: |
          nohup node tools/serve-demo.mjs --no-build --port 4300 > serve-demo.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:4300/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:4300/ && echo "demo served"
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false
      # The action only collects and asserts (its runs land in .lighthouseci); the config's filesystem
      # upload target, which writes lhci-report/ with the manifest the summary reads, is a separate step.
      # Same CLI version the action bundles.
      - name: Reports and manifest into lhci-report
        run: npx --yes @lhci/cli@0.15.1 upload --config=./lighthouserc.json
      - name: Scores
        run: set -o pipefail; node tools/ci/lighthouse-summary.mjs lhci-report --json lhci-report/lighthouse.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse-${{ github.run_number }}
          path: |
            lhci-report
            serve-demo.log
          retention-days: 30
      - name: Pages site (previous state)
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      - name: This run's report and the latest scores into the site
        run: |
          mkdir -p site/lighthouse && rm -rf site/.git "site/lighthouse/$GITHUB_RUN_NUMBER"
          cp -r lhci-report "site/lighthouse/$GITHUB_RUN_NUMBER"
          cp lhci-report/lighthouse.json site/lighthouse/latest.json
          ls -d site/lighthouse/[0-9]* | sort -t/ -k3 -n | head -n -30 | xargs -r rm -rf
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This tier prunes all but the last thirty runs above, and the overlay push only ever adds
          # unless a path is declared ours. Without this the branch would grow forever.
          PAGES_REPLACE: lighthouse
        # A retrying overlay push rather than the action, because several tiers publish in parallel
        # now and the loser of the race used to drop its whole report. See the script's header.
        run: |
          bash tools/ci/publish-pages.sh site "lighthouse run ${{ github.run_number }}"

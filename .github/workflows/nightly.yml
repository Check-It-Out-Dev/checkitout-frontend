# The night pipeline: everything the pull-request pipeline cannot afford.
#
# The trade is explicit. `pr.yml` answers "is this change safe to merge" in about ten minutes and
# is allowed to miss things a ten-minute run cannot see. This answers "is the system actually
# healthy", takes as long as it takes, and runs while nobody is waiting.
#
#   browser (full)   the smoothness tier over three runners and the visual tier in the pinned container
#   full-stack       the ported Cucumber corpus against the real backend image and a Firebase emulator
#   kubernetes       a kind cluster: Playwright as a four-pod Indexed Job, k6-operator generating load
#   lighthouse       performance, accessibility, best practices and SEO against the demo build
#   contract         the OpenAPI document taken from a booted backend, the client regenerated and compiled
#   mutation         Stryker: whether the tests would notice if the code were wrong
#   security         Semgrep, Checkov, Trivy, an SBOM, and a ZAP baseline against the live sandbox
#
# Everything lands in one report and one verdict, and the metrics are appended to a history that the
# dashboard trends over weeks. A night run that nobody reads is a night run that should not exist.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      skip_kubernetes:
        description: Skip the kind cluster tier (it is the slowest)
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

# The floor. Every tier that publishes to the Pages branch raises its own grant below, and the
# security tier asks for the code-scanning scope itself, so nothing here holds more than it needs.
permissions:
  contents: read

jobs:
  browser:
    name: Browser tiers (full)
    uses: ./.github/workflows/browser-tiers.yml
    with:
      tiers: full
    # A called workflow may never hold more than the job that calls it, and this one publishes
    # its results to the Pages branch. Granted here rather than at the top of the file so the
    # jobs that only read stay read-only.
    permissions:
      contents: write
    # No `secrets: inherit`. It hands a called workflow EVERY secret the repository and its
    # environments hold, whether the callee has a use for them or not. The GITHUB_TOKEN a called
    # workflow needs is passed automatically, bounded by the `permissions` above, and the one tier
    # that does need repository secrets -- the Kubernetes run's k6 remote write -- reaches them
    # through its own `environment: grafana-cloud`, not through here. Reported by Semgrep's
    # yaml.github-actions.security.secrets-inherit.

  full-stack:
    name: Full stack
    uses: ./.github/workflows/nightly-full-stack.yml
    permissions:
      contents: write
    # No `secrets: inherit`, and nothing to pass: see the note on the first tier above.

  kubernetes:
    name: Kubernetes tier
    if: ${{ !inputs.skip_kubernetes }}
    uses: ./.github/workflows/k8s-test-execution.yml
    permissions:
      contents: write
    # No `secrets: inherit`, and nothing to pass: see the note on the first tier above.

  lighthouse:
    name: Lighthouse
    uses: ./.github/workflows/lighthouse.yml
    permissions:
      contents: write
    # No `secrets: inherit`, and nothing to pass: see the note on the first tier above.

  contract:
    name: Contract
    uses: ./.github/workflows/contract-check.yml
    # No `secrets: inherit`, and nothing to pass: see the note on the first tier above.

  mutation:
    name: Mutation
    uses: ./.github/workflows/mutation.yml
    # It writes its score to the Pages branch so the dashboard can trend test quality over time,
    # and a called workflow may never hold more than the job that calls it.
    permissions:
      contents: write
    # No `secrets: inherit`, and nothing to pass: see the note on the first tier above.

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      # write, because the tier now also publishes its finding count for the dashboard to trend.
      contents: write
      security-events: write
    # No `secrets: inherit`, and nothing to pass: see the note on the first tier above.

  verdict:
    name: One night, one verdict
    needs: [browser, full-stack, kubernetes, lighthouse, contract, mutation, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --loglevel=error

      - name: Collect what the tiers published
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: results
        continue-on-error: true

      - name: The night in one table
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -o pipefail
          node tools/ci/nightly-verdict.mjs --needs "$NEEDS" --results results \
            --json nightly-summary.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: nightly-${{ github.run_number }}
          path: nightly-summary.json
          retention-days: 90

# /etc/nginx/snippets/checkitout-sandbox-location.conf on the VPS, included from the checkitout.app
# server block (app-public.conf) with one line:
#
#     include /etc/nginx/snippets/checkitout-sandbox-location.conf;
#
# One public address for two different things. https://checkitout.app/ is the demo — the whole product
# with its backend mocked in the browser, served as static files from /var/www/check-it-out.pl.
# https://checkitout.app/sandbox/ is the same product against the real stack: Spring Boot on the dev-lite
# and sandbox profiles, PostgreSQL, Redis, two shared persona accounts, reset every night. A visitor moves
# between them without leaving the address that is printed on the CV.
#
# `^~` is load-bearing. The demo's block matches static extensions with a regex location, and a regex
# location beats a plain prefix location: without `^~` every /sandbox/*.js would be looked up in the
# demo's document root and 404. `^~` tells nginx to stop once this prefix matches.
#
# The upstream `checkitout_sandbox` is declared in sandbox.checkitout.app.conf, which also keeps the old
# hostname alive as a permanent redirect here.
location ^~ /sandbox/ {
    # The trailing slash strips /sandbox/ before proxying, so the container keeps serving at / and knows
    # nothing about the prefix. The Angular build carries <base href="/sandbox/">, so the pages it writes
    # and the API base it calls (/sandbox/api) keep the prefix on the browser's side.
    proxy_pass http://checkitout_sandbox/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # The backend writes Path=/ on the session cookie. Left alone, the browser would send the sandbox's
    # session to the demo as well — same host now. Scoped to the prefix, it cannot leave the sandbox.
    proxy_cookie_path / /sandbox/;
    # A Location header the backend writes as /api/... has to come back with the prefix on it.
    proxy_redirect /api/ /sandbox/api/;
    proxy_redirect / /sandbox/;

    # The demo block sets no body limit, so nginx's 1 MB default would otherwise apply to uploads here.
    client_max_body_size 25m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
}

# Without the trailing slash there is no base href to resolve against and the shell loads broken.
location = /sandbox { return 301 https://$host/sandbox/; }

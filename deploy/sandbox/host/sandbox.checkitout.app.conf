# /etc/nginx/sites-available/sandbox.checkitout.app.conf on the VPS (symlink into sites-enabled, nginx -t,
# reload). Two jobs now.
#
# 1. It declares the upstream that checkitout-sandbox-location.conf proxies to. The compose stack listens
#    on 127.0.0.1:8090 only; the host nginx owns TLS and every public name.
#
# 2. It keeps the old hostname answering. The sandbox used to live at https://sandbox.checkitout.app and
#    now lives at https://checkitout.app/sandbox/ — one address for the mocked demo and the real stack,
#    because that address is the one on the CV. The certificate stays (certbot renews it through the
#    /var/www/le webroot), and every request is redirected permanently, path and query intact.
#
# Security headers come from the compose nginx and the backend, one source (pentest findings 3.10 / 3.11),
# so none are repeated here.

upstream checkitout_sandbox {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sandbox.checkitout.app;
    location /.well-known/acme-challenge/ { root /var/www/le; }
    location / { return 301 https://checkitout.app/sandbox$request_uri; }
}

server {
    # `listen … http2` rather than `http2 on`: the host runs nginx 1.24, which predates the directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sandbox.checkitout.app;

    ssl_certificate     /etc/letsencrypt/live/sandbox.checkitout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandbox.checkitout.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The certificate has to keep renewing for the redirect to stay reachable over https.
    location /.well-known/acme-challenge/ { root /var/www/le; }
    location / { return 301 https://checkitout.app/sandbox$request_uri; }
}

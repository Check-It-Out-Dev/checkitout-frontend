# /etc/nginx/sites-available/sandbox.checkitout.app.conf on the VPS (symlink into sites-enabled, nginx -t,
# reload). The host nginx owns TLS and the public name; the compose stack listens on 127.0.0.1:8090 only.
# Cloudflare proxies the hostname; the certificate is a Cloudflare origin certificate (owner) or certbot
# through the existing /var/www/le webroot. Security headers come from the compose nginx and the backend,
# one source (pentest findings 3.10 / 3.11), so none are repeated here.

upstream checkitout_sandbox {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sandbox.checkitout.app;
    location /.well-known/acme-challenge/ { root /var/www/le; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sandbox.checkitout.app;

    ssl_certificate     /etc/ssl/checkitout/sandbox.checkitout.app.pem;
    ssl_certificate_key /etc/ssl/checkitout/sandbox.checkitout.app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;

    # While the backend restarts (deploy, nightly reseed) the static shell still answers; /api returns 502
    # from the compose nginx and the app shows its own error state.
    location / {
        proxy_pass http://checkitout_sandbox;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# The backend from the public image, booted with the credential-less dev-lite profile:
# mock-session auth (no Firebase), stubbed registries, GreenMail in-process, local file sink,
# the seeded demo world from Liquibase contexts dev,local,dev-lite. Plain HTTP on 8080: the
# ssl profile stays off in the cluster, the frontend's nginx is the only client of this port.
# Relaxed binding turns SPRING_DATASOURCE_HOST into spring.datasource.host, which the dev profile
# reads into its JDBC URL; same for the Redis host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: checkitout
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      # Hardening every image here tolerates; what is deliberately absent, and why, is at the
      # bottom of kustomization.yaml.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # Without this the four emptyDirs below arrive root:root 0755 and the container, which runs
        # as 1002, cannot write to any of them -- readOnlyRootFilesystem then fails at the first
        # log line rather than at apply time. fsGroup makes the kubelet chgrp them to 1005 and set
        # the setgid bit, which is the only reason a read-only root filesystem works here at all.
        fsGroup: 1005
      initContainers:
        - name: wait-for-postgres
          # `nc -z` needs no privilege of any kind, so it gets none: nobody, no capabilities, no
          # writable filesystem.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: backend
          # The one image here we build ourselves, so it is the one that can be held to the whole
          # standard. The Dockerfile already ends `USER instagram-test-deploy` (1002:1005); naming
          # the ids here turns that from a property of the image into a property of the pod, which
          # is what survives someone rebuilding the image with a different USER line. A JVM serving
          # HTTP on 8080 needs no capabilities at all, and every path it writes is mounted below.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1002
            runAsGroup: 1005
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: ghcr.io/check-it-out-dev/checkitout-backend:main
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: dev-lite }
            - { name: SPRING_DATASOURCE_HOST, value: postgres }
            - { name: SPRING_DATASOURCE_PORT, value: "5432" }
            - { name: SPRING_DATA_REDIS_HOST, value: redis }
            - { name: SPRING_DATA_REDIS_PORT, value: "6379" }
            - { name: SPRING_LIQUIBASE_CONTEXTS, value: "dev,local,dev-lite" }
            - { name: SERVER_PORT, value: "8080" }
            # The image already sets G1 and MaxRAMPercentage=70 in JAVA_OPTS; a 2 Gi limit gives ~1.4 Gi of heap.
            # Do not add a second collector through JAVA_TOOL_OPTIONS: the JVM refuses to start.
          # Liquibase seeds ~26 campaigns on first boot: five minutes before liveness counts.
          # The probes use the two groups the application defines for Kubernetes (readiness: db, redis,
          # diskSpace, uploadSystem; liveness: ping, application), never the overall health: that one also
          # carries optional components, and the first cluster run on the CI-built image sat at 503 for
          # ten minutes on one of them (the upload system probing a bucket dev-lite never uses).
          startupProbe:
            httpGet: { path: /api/actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/actuator/health/liveness, port: http }
            periodSeconds: 15
          resources:
            # Memory is limited because a JVM that overruns its container is killed in a way nobody
            # can read afterwards. CPU deliberately is not: a CPU limit throttles the JVM during
            # Liquibase's first-boot seeding, which is the slowest thing this pod ever does and the
            # one the startup probe is timing. Trivy reports the absence (KSV-0011); this is the
            # answer.
            requests: { cpu: 800m, memory: 1Gi }
            limits: { memory: 2Gi }
          # readOnlyRootFilesystem needs every writable path named, and "every" is the hard word.
          # These five are all of them: the JVM's temp directory, the two the Dockerfile creates and
          # chowns, the dev-lite upload sink (./dev-lite-storage relative to the image's WORKDIR of
          # /app), and /app/target, where the dev profile's logback appender writes
          # target/var/log/checkitout-backend-dev-unified.log -- a developer-machine convention that
          # follows the profile into the container.
          #
          # That last one is not hypothetical. It was missed on the first attempt, and the pod did
          # not degrade: Spring Boot treats a logback configuration error as fatal, so the
          # application refused to start at all and the deployment sat in CrashLoopBackOff until the
          # progress deadline. A path missed here fails at start-up or at the first write, never at
          # apply time, which is why the list is written out rather than inferred.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: app-logs, mountPath: /app/logs }
            - { name: app-tmp, mountPath: /app/tmp }
            - { name: app-uploads, mountPath: /app/dev-lite-storage }
            - { name: app-target, mountPath: /app/target }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: app-logs, emptyDir: {} }
        - { name: app-tmp, emptyDir: {} }
        - { name: app-uploads, emptyDir: {} }
        - { name: app-target, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: checkitout
spec:
  selector: { app: backend }
  ports:
    - { port: 8080, targetPort: http }

# The backend from the public image, booted with the credential-less dev-lite profile:
# mock-session auth (no Firebase), stubbed registries, GreenMail in-process, local file sink,
# the seeded demo world from Liquibase contexts dev,local,dev-lite. Plain HTTP on 8080: the
# ssl profile stays off in the cluster, the frontend's nginx is the only client of this port.
# Relaxed binding turns SPRING_DATASOURCE_HOST into spring.datasource.host, which the dev profile
# reads into its JDBC URL; same for the Redis host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: checkitout
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      # Hardening every image here tolerates; what is deliberately absent, and why, is at the
      # bottom of kustomization.yaml.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          securityContext:
            allowPrivilegeEscalation: false
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
          image: ghcr.io/check-it-out-dev/checkitout-backend:main
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: dev-lite }
            - { name: SPRING_DATASOURCE_HOST, value: postgres }
            - { name: SPRING_DATASOURCE_PORT, value: "5432" }
            - { name: SPRING_DATA_REDIS_HOST, value: redis }
            - { name: SPRING_DATA_REDIS_PORT, value: "6379" }
            - { name: SPRING_LIQUIBASE_CONTEXTS, value: "dev,local,dev-lite" }
            - { name: SERVER_PORT, value: "8080" }
            # The image already sets G1 and MaxRAMPercentage=70 in JAVA_OPTS; a 2 Gi limit gives ~1.4 Gi of heap.
            # Do not add a second collector through JAVA_TOOL_OPTIONS: the JVM refuses to start.
          # Liquibase seeds ~26 campaigns on first boot: five minutes before liveness counts.
          # The probes use the two groups the application defines for Kubernetes (readiness: db, redis,
          # diskSpace, uploadSystem; liveness: ping, application), never the overall health: that one also
          # carries optional components, and the first cluster run on the CI-built image sat at 503 for
          # ten minutes on one of them (the upload system probing a bucket dev-lite never uses).
          startupProbe:
            httpGet: { path: /api/actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/actuator/health/liveness, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 800m, memory: 1Gi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: checkitout
spec:
  selector: { app: backend }
  ports:
    - { port: 8080, targetPort: http }

# kubectl apply -k deploy/k8s/base
# Image tags belong to the caller: the workflow pins the backend to the SHA it built
# (kustomize edit set image ghcr.io/check-it-out-dev/checkitout-backend=...:sha-abc1234)
# and the frontend to the image it loaded into kind.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: checkitout
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
images:
  - name: ghcr.io/check-it-out-dev/checkitout-backend
    newTag: main
  - name: checkitout-frontend
    newTag: ci

# ---------------------------------------------------------------------------------------------
# What is NOT set on these pods, and why.
#
# Trivy's KSV rules ask for runAsNonRoot, readOnlyRootFilesystem and `capabilities: drop: ALL` on
# every container. Three of the four images here are stock -- postgres, redis and nginx -- and each
# starts as root on purpose: postgres and redis run initdb and chown before dropping to their own
# user through su-exec, which needs CHOWN, SETUID and SETGID, and nginx binds port 80, which needs
# NET_BIND_SERVICE. Dropping all capabilities stops all three before they start, and runAsNonRoot
# stops the two that have to chown a fresh data directory first. readOnlyRootFilesystem needs an
# emptyDir per writable path per image, which is a different shape of change and one that fails at
# start-up rather than in review.
#
# The test manifests under deploy/k8s/tests are left alone for a reason of their own: the Playwright
# image runs Chromium, whose sandbox is a setuid binary that `allowPrivilegeEscalation: false`
# disables, and the k6 runner pods are generated by the operator rather than written here.
#
# So what IS set is what every image here tolerates: no privilege escalation, the runtime's default
# seccomp profile, and no service-account token, since nothing in this cluster talks to the API
# server. The rest is a deliberate gap in a cluster that exists for twelve minutes inside a GitHub
# runner, holds synthetic data and is destroyed with the job -- not in anything that serves a user.
# Hosting stays Docker Compose and systemd (docs/ci/ARCHITECTURE.md); this is a test substrate, and
# hardening it past the point where it starts would buy nothing and cost the tier.
# ---------------------------------------------------------------------------------------------

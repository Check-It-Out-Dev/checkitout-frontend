# kubectl apply -k deploy/k8s/base
# Image tags belong to the caller: the workflow pins the backend to the SHA it built
# (kustomize edit set image ghcr.io/check-it-out-dev/checkitout-backend=...:sha-abc1234)
# and the frontend to the image it loaded into kind.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: checkitout
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
images:
  - name: ghcr.io/check-it-out-dev/checkitout-backend
    newTag: main
  - name: checkitout-frontend
    newTag: ci

# ---------------------------------------------------------------------------------------------
# What is set on these pods, what is not, and why.
#
# The backend is the one image here we build ourselves, so it is held to the whole standard:
# runAsNonRoot with the ids its own Dockerfile ends on (1002:1005), `capabilities: drop: ALL`,
# readOnlyRootFilesystem with an emptyDir for each of the four paths it actually writes, no
# privilege escalation, the runtime's default seccomp profile, and no service-account token. The
# init container gets the same, as nobody, because `nc -z` needs nothing at all.
#
# The other three are stock -- postgres, redis and nginx -- and each starts as root on purpose:
# postgres and redis run initdb and chown before dropping to their own user through su-exec, which
# needs CHOWN, SETUID and SETGID, and nginx binds port 80, which needs NET_BIND_SERVICE. Dropping
# all capabilities stops all three before they start, and runAsNonRoot stops the two that have to
# chown a fresh data directory first. They keep what every image tolerates -- no privilege
# escalation, RuntimeDefault seccomp, no service-account token -- and Trivy's KSV-0012, KSV-0003,
# KSV-0004 and KSV-0106 against them are accepted here rather than answered.
#
# The backend has no CPU limit, deliberately: one throttles the JVM through Liquibase's first-boot
# seeding, which is the slowest thing the pod does and the thing the startup probe is timing.
#
# The test manifests under deploy/k8s/tests are left alone for a reason of their own: the Playwright
# image runs Chromium, whose sandbox is a setuid binary that `allowPrivilegeEscalation: false`
# disables, and the k6 runner pods are generated by the operator rather than written here.
#
# The gap that remains is deliberate and bounded: a cluster that exists for twelve minutes inside a
# GitHub runner, holds synthetic data and is destroyed with the job. Hosting stays Docker Compose
# and systemd (docs/ci/ARCHITECTURE.md); this is a test substrate, and hardening a stock image past
# the point where it starts would buy nothing and cost the tier.
# ---------------------------------------------------------------------------------------------

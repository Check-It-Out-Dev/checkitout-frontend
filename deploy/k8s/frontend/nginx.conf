# nginx for the in-cluster frontend. Mirrors the production site's shape in three rules:
#   1. prerendered pages are served from their own index.html, everything else falls back to the
#      SPA shell (the try_files form that never 301s to a trailing slash);
#   2. /api is proxied to the backend Service, so the browser sees a single origin;
#   3. cookies from the backend are re-flagged for plain HTTP inside the cluster: without this the
#      Secure flag makes the browser drop the session cookie on http://frontend.checkitout.svc and
#      every test would fail at sign-in with nothing in the UI to explain it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # The dev-lite profile receives uploads through /api/dev-lite/upload; the upload tier sends 5 MB.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://backend.checkitout.svc:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cookie_domain ~.* $host;
        proxy_cookie_flags ~ nosecure samesite=lax;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}

<main class="min-h-screen bg-cream" data-testid="team-page">
  <app-marketing-toolbar />

  <section class="mx-auto max-w-5xl px-6 pb-24 pt-16 md:px-8">
    <div class="mb-12 text-center">
      <span
        class="inline-block rounded-full bg-coral-50 px-4 py-2 font-mono text-[11px] uppercase tracking-[0.18em] text-coral-600"
      >
        {{ 'landing.team.subtitle' | transloco }}
      </span>
      <h1
        class="mt-4 font-display text-4xl font-normal text-ink md:text-5xl"
        data-testid="team-title"
      >
        {{ 'landing.team.title' | transloco }}
      </h1>
      <p class="mx-auto mt-3 max-w-3xl text-sm leading-relaxed text-slate2 md:text-base">
        {{ 'landing.team.description' | transloco }}
      </p>
    </div>

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-3">
      @for (member of teamMembers; track member.name) {
        <article
          class="flex flex-col rounded-2xl border border-beige bg-white p-6 transition hover:-translate-y-1 hover:shadow-md"
          [attr.data-testid]="'team-member-' + member.name.split(' ')[0]"
        >
          <div class="flex justify-center py-6">
            <!-- Same reasoning as the landing roster: this page IS the photos,
                 so deferring them only creates a way for them not to arrive. -->
            <img
              [src]="member.photo"
              [alt]="member.name"
              width="112"
              height="112"
              decoding="async"
              class="h-28 w-28 rounded-full border-2 border-coral-100 object-cover"
            />
          </div>
          <h3 class="text-center font-display text-2xl font-normal text-ink">{{ member.name }}</h3>
          <p
            class="mt-1 text-center font-mono text-[10px] uppercase tracking-[0.18em] text-coral-600"
          >
            {{ member.role }}
          </p>
          <div class="mt-6 flex flex-grow items-end justify-center gap-3">
            <a
              [href]="member.socialLinks.linkedin"
              target="_blank"
              rel="noopener"
              class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-coral-50 text-coral-600 transition hover:bg-coral-500 hover:text-cream"
              [attr.aria-label]="member.name + ' — LinkedIn'"
            >
              <svg
                width="16"
                height="16"
                fill="currentColor"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <path
                  d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854V1.146zm4.943 12.248V6.169H2.542v7.225h2.401zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016a5.54 5.54 0 0 1 .016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"
                ></path>
              </svg>
            </a>
            @if (member.socialLinks.github) {
              <a
                [href]="member.socialLinks.github"
                target="_blank"
                rel="noopener"
                class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-coral-50 text-coral-600 transition hover:bg-coral-500 hover:text-cream"
                [attr.aria-label]="member.name + ' — GitHub'"
              >
                <svg
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                  aria-hidden="true"
                >
                  <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                  ></path>
                </svg>
              </a>
            }
          </div>
        </article>
      }
    </div>

    <p class="mt-8 text-center text-sm text-slate2">
      {{ 'landing.oss.team.note' | transloco }}
    </p>
  </section>
</main>

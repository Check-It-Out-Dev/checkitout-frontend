# check-it-out.pl on the greenfield test VPS (57.128.225.42) — adapted from
# vpsnew's sites-available/check-it-out.pl.conf, self-contained (no external
# conf.d dependencies beyond cio-zones.conf). The gate mirrors prod: nginx
# auth_request -> checkitout-gate on 127.0.0.1:5000 (the "htaccess" app).
# Domain swap: /usr/local/bin/set-domain.sh <new-domain> [--issue]

server {
    listen 80;
    server_name check-it-out.pl www.check-it-out.pl;

    # certbot webroot (usable once DNS points here)
    location /.well-known/acme-challenge/ {
        root /var/www/le;
    }
    location / {
        # The standard HTTP-to-HTTPS redirect: same host, same path, scheme upgraded.
        return 301 https://$host$request_uri;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
    }
}

server {
    listen 443 ssl http2;

    server_name check-it-out.pl www.check-it-out.pl;
    root /var/www/check-it-out.pl;
    index index.html;

    # self-signed until DNS points here (Cloudflare "Full" accepts it;
    # set-domain.sh --issue switches to Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/check-it-out.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/check-it-out.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/check-it-out.pl.access.log;
    error_log /var/log/nginx/check-it-out.pl.error.log warn;

    limit_conn cio_conn_ip 20;

    # security headers (single-source law: only nginx sets these)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;


    # the film's vanity URL — real since the domain moved here: no gate, a
    # plain redirect to the installer on OVH object storage
    location = /downloads/codemap {
        return 302 https://storage.waw.cloud.ovh.net/v1/AUTH_62ce8c0b4d874faa89fb3e086832f1a6/downloads/codemap/codemap-setup-1.2.0.exe;
    }
    # the gate — same auth_request pattern as prod vpsnew
    location / {
        limit_req zone=cio_general burst=20 nodelay;
        auth_request /validate-session;
        error_page 401 = @error401;
        try_files $uri $uri/index.html /index.html;
    }

    # The SPA shell must always revalidate: a hashed bundle is only as fresh
    # as the index.html that references it. Without this, browsers applied
    # heuristic freshness (a tenth of the file's age) and kept serving the
    # previous build for a day after a deploy. `expires -1` emits
    # Cache-Control: no-cache without an add_header, so the server-level
    # security headers keep inheriting here. The same location is repeated
    # in the public vhosts (app-public.conf, greenfield-public.conf).
    location = /index.html {
        limit_req zone=cio_general burst=20 nodelay;
        auth_request /validate-session;
        error_page 401 = @error401;
        expires -1;
    }

    location = /validate-session {
        internal;
        proxy_pass http://127.0.0.1:5000/validate_session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /login-tst {
        limit_req zone=cio_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000/login;
        # The upstream builds no URL from the Host header; see the note in the k8s template.
        proxy_set_header Host $host;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @error401 {
        # Same host, fixed path.
        return 302 https://$host/login-tst;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
    }

    # backend not migrated yet — honest stub instead of a hang
    location /api/ {
        default_type application/json;
        return 503 '{"error":"backend not migrated to this host yet"}';
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK greenfield\n";
    }

    # hashed-name bundles are immutable
    location ~* \.(js|css|jpg|jpeg|gif|png|svg|webp|ico|woff|woff2|ttf|otf)$ {
        limit_req zone=cio_general burst=50 nodelay;
        auth_request /validate-session;
        error_page 401 = @error401;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
